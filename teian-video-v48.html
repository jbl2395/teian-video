/* ── 10a. WebCodecs（高速・非実時間） ── */
async function encodeWebCodecs(tl,T,prog){
  if(!window.VideoEncoder||!window.AudioEncoder) throw new Error("WebCodecs非対応");
  if(!window.Mp4Muxer) await loadScript("https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js");
  if(!window.Mp4Muxer) throw new Error("muxer読み込み失敗");

  const W=Number(S.width), H=Number(S.height), fps=Number(S.fps);
  /* 音声の細かさ（ビットレート）は、ブラウザによって受け付ける値が決まっている。
     Windows の Chrome / Edge は 96000・128000・160000・192000 しか通らないので、
     使える値を先に確かめてから決める（ここを外すと音が1つも入らず、実時間の録画方式に落ちる）。 */
  let audioBits=128000;
  try{
    if(AudioEncoder.isConfigSupported){
      for(const b of [128000,96000,160000,192000,64000]){
        const r=await AudioEncoder.isConfigSupported({codec:"mp4a.40.2",sampleRate:ASR,numberOfChannels:1,bitrate:b});
        if(r&&r.supported){ audioBits=b; break; }
      }
    }
  }catch{}
  log(`音声 ${(audioBits/1000)|0} kbps で作ります`);
  const videoBits=Math.max(4e5,Math.min(3.2e6,
    (Number(S.targetMB)*8*1048576 - audioBits*T)/Math.max(1,T)));
  log(`720p / ${(videoBits/1e6).toFixed(2)} Mbps で作ります`);

  const M=window.Mp4Muxer;
  const muxer=new M.Muxer({
    target:new M.ArrayBufferTarget(),
    video:{codec:"avc",width:W,height:H},
    audio:{codec:"aac",sampleRate:48000,numberOfChannels:1},
    fastStart:"in-memory",
  });
  let vErr=null,aErr=null,vChunks=0,aChunks=0,aenc2=null;
  const venc=new VideoEncoder({
    output:(c,m)=>{vChunks++;muxer.addVideoChunk(c,m);},
    error:e=>{vErr=e;log("映像エンコーダ："+(e.message||e),"e");}});
  venc.configure({codec:"avc1.42001F",width:W,height:H,bitrate:videoBits,framerate:fps});
  const fixMeta=m=>{
    const asc=ascOf(m&&m.decoderConfig&&m.decoderConfig.description,ASR,1);
    if(aChunks===1) log("音声設定 "+[...asc].map(x=>x.toString(16).padStart(2,"0")).join(" "),"s");
    return {decoderConfig:{codec:"mp4a.40.2",sampleRate:ASR,numberOfChannels:1,description:asc}};
  };
  const aenc=new AudioEncoder({
    output:(c,m)=>{aChunks++;muxer.addAudioChunk(c,fixMeta(m));},
    error:e=>{aErr=e;log("音声エンコーダ："+(e.message||e),"e");}});
  aenc.configure({codec:"mp4a.40.2",sampleRate:ASR,numberOfChannels:1,bitrate:audioBits});

  // ── 先に音声を作って入れておく（後入れだと取りこぼす環境があるため） ──
  st("音声を合わせています…");
  await encodeAudio(tl,T,()=>{});

  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d",{alpha:false});

  // ── 映像 ──
  const totalFrames=Math.ceil(T*fps);
  let f=0;
  const shot=(c,i,key)=>{                     // 1コマ描いて入れる
    draw(g,W,H,W/1280,c.p,c.start+i/fps);
    const frame=new VideoFrame(cv,{timestamp:Math.round(f*1e6/fps),duration:Math.round(1e6/fps)});
    venc.encode(frame,{keyFrame:key});
    frame.close(); f++;
  };
  const breathe=async()=>{
    if(f%15===0) prog(f/totalFrames*0.92);
    if(f%30===0) await nap(0);
    if(venc.encodeQueueSize>24) await nap(12);
  };
  for(const c of tl){
    const n=Math.max(1,Math.round(c.dur*fps));
    if(c.p.mediaId&&!c.media)
      log(`このページの写真・動画をこのブラウザで読み込めていません（種類：${badMedia.get(c.p.mediaId)||"不明"}）。絵なしで作ります`,"w");
    const vid=(c.media&&c.media.kind==="video")?c.media.el:null;
    const start=c.p.trimStart||0;
    const end=Math.min((c.p.trimEnd||c.media&&c.media.dur||0)||1e9,(c.media&&c.media.dur)||1e9);
    let livePlay=false;
    if(vid){
      livePlay=await warmUp(vid,start);
      log(livePlay?"動画クリップを再生しながら取り込みます"
                  :"この動画は再生できないため、コマ送りで取り込みます", livePlay?"s":"w");
      // 絵が出ていないまま進むと真っ黒な動画ができてしまう。少し粘ってから確かめる
      if(looksBlank(vid)){
        for(let k=0;k<6&&looksBlank(vid);k++){
          try{ await vid.play(); }catch{}
          await nap(120);
        }
        try{ if(livePlay) await seek(vid,start,600); else vid.pause(); }catch{}
        if(looksBlank(vid)) log("この動画の絵を取り込めません（真っ黒になります）。"
          +"別の形式で入れ直すか、写真に置き換えてください","w");
      }
    }
    for(let i=0;i<n;i++){
      if(vid){
        const tv=start+i/fps;
        if(livePlay) await follow(vid,tv,end);
        else await seek(vid, tv>end?Math.max(0,end-0.03):tv, 600);
      }
      shot(c,i,i===0);
      await breathe();
    }
    if(vid){ try{ vid.pause(); }catch{} }
  }
  await venc.flush(); venc.close();

  if(vErr) throw new Error("映像の書き出しに失敗："+(vErr.message||vErr));
  log(`映像 ${vChunks} 個を書き出しました`);
  muxer.finalize();
  prog(1);
  return new Blob([muxer.target.buffer],{type:"video/mp4"});

  /* ── 動画クリップの取り込み ──
     iPhone で撮った動画は 1コマずつ seek すると間に合わず、同じ絵のまま固まってしまう。
     そこで実際に再生させて、その時どきの絵を取り込む。再生できないときだけ従来のコマ送り。 */
  async function warmUp(v,start){
    try{
      v.muted=true; v.playsInline=true; v.pause();
      await seek(v,start,600);
      await v.play();
    }catch{ try{v.pause();}catch{} return false; }
    const t0=v.currentTime, w0=Date.now();
    while(Date.now()-w0<900){
      await nap(50);
      if(v.currentTime-t0>0.05){                 // ちゃんと進んでいる
        try{ v.pause(); }catch{}
        await seek(v,start,600);                 // 頭に戻してから取り込み開始
        return true;
      }
    }
    try{ v.pause(); }catch{}
    await seek(v,start,600);
    return false;
  }
  /* 目標の時刻まで再生して待つ。追い越したらそのコマで妥協する（＝早送りにしない） */
  async function follow(v,want,end){
    if(want>=end-0.02){ if(!v.paused){ try{v.pause();}catch{} } return; }  // 終わりは最後の絵で止める
    let guard=0;
    while(v.currentTime<want-0.004 && !v.ended && guard++<300){
      if(v.paused){ try{ await v.play(); }catch{ break; } }
      await nap(5);
    }
    // エンコードが遅れて先へ行ってしまったら、いったん止めて足踏みさせる
    if(!v.paused && v.currentTime>want+2/fps){ try{ v.pause(); }catch{} }
  }

  async function encodeAudio(tl,T,prog){
  const SR=ASR, total=Math.max(SR,Math.ceil(T*SR));
  const nVoice=tl.filter(c=>voiceOf(c.p)).length;
  log(`読み上げ ${nVoice} 本を ${fmt(T)} に配置します`);
  let pcm;
  try{
    const off=new OfflineAudioContext(1,total,SR);
    for(const c of tl){
      const a=voiceOf(c.p); if(!a||!a.buf) continue;
      const src=off.createBufferSource(); src.buffer=a.buf;
      if(useRec){ const gn=off.createGain(); gn.gain.value=normGain(a.buf); src.connect(gn); gn.connect(off.destination); }
      else src.connect(off.destination);
      src.start(Math.max(0,c.start));
    }
    const mixed=await off.startRendering();
    pcm=mixed.getChannelData(0);
  }catch(e){ throw new Error("音声のミックスに失敗："+(e.message||e)); }

  lastPCM=pcm; lastSR=SR;
  let peak=0;
  for(let i=0;i<pcm.length;i+=97) peak=Math.max(peak,Math.abs(pcm[i]));
  log(`音声の大きさ ${(peak*100).toFixed(0)}%`, peak<0.01?"e":"s");
  if(peak<0.01) log("音声データが無音です。読み上げ文が入っているか確認してください。","w");

  // AAC は 1024 フレーム単位。端数はゼロ埋めして必ず 1024 で渡す
  const CH=1024;
  const frames=Math.ceil(pcm.length/CH);
  let fmtUsed="f32-planar", triedAlt=false;
  for(let k=0;k<frames;k++){
    if(aErr&&!triedAlt){                       // 形式が合わない場合の入れ替え
      triedAlt=true; aErr=null; fmtUsed="f32";
      log("音声の形式を切り替えて再試行します","w");
      try{ aenc.close(); }catch{}
      aChunks=0; k=-1;
      const a2=new AudioEncoder({
        output:(c,m)=>{aChunks++;muxer.addAudioChunk(c,fixMeta(m));},
        error:e=>{aErr=e;log("音声エンコーダ："+(e.message||e),"e");}});
      a2.configure({codec:"mp4a.40.2",sampleRate:SR,numberOfChannels:1,bitrate:audioBits});
      aenc2=a2; continue;
    }
    const enc=aenc2||aenc;
    const seg=new Float32Array(CH);
    const off2=k*CH;
    seg.set(pcm.subarray(off2,Math.min(off2+CH,pcm.length)));
    const data=new AudioData({
      format:fmtUsed,sampleRate:SR,numberOfFrames:CH,numberOfChannels:1,
      timestamp:Math.round(off2/SR*1e6),data:seg});
    try{ enc.encode(data); }catch(e){ aErr=e; }
    data.close();
    if(k%120===0){ prog(0.95+0.04*(k/frames)); await new Promise(r=>setTimeout(r,0)); }
    if(enc.encodeQueueSize>60) await new Promise(r=>setTimeout(r,10));
  }
  const encF=aenc2||aenc;
  try{ await encF.flush(); encF.close(); }catch(e){ aErr=aErr||e; }
  log(`音声 ${aChunks} 個を書き出しました`, aChunks?"s":"e");
  if(!aChunks){
    throw new Error("音声を動画に入れられませんでした"+(aErr?("："+(aErr.message||aErr)):""));
  }
  }
}
const nap=ms=>new Promise(r=>setTimeout(r,ms));
const seek=(v,t,ms)=>new Promise(res=>{
  if(Math.abs(v.currentTime-t)<0.005) return res();
  let done=false;
  const on=()=>{if(done)return;done=true;v.removeEventListener("seeked",on);res();};
  v.addEventListener("seeked",on);
  try{v.currentTime=t;}catch{on();}
  setTimeout(on,ms||220);
});

/* ── 10b. MediaRecorder（保険・実時間） ── */
async function encodeRecorder(tl,T,prog){
  const W=Number(S.width),H=Number(S.height),fps=Number(S.fps);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const g=cv.getContext("2d",{alpha:false});
  const mimes=['video/mp4;codecs="avc1.42001F,mp4a.40.2"','video/mp4',
    'video/webm;codecs=vp9,opus','video/webm'];
  const mime=mimes.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mime) throw new Error("録画に対応していません");
  const ac=AC();
  /* iOSは他の音を鳴らしたあとに音の土台（AudioContext）を止めることがある。
     止まったままだと時間が進まず、0%のまま永久に待つので、ここで必ず確かめる */
  for(let i=0;i<3&&ac.state!=="running";i++){
    try{ await ac.resume(); }catch{}
    if(ac.state!=="running") await new Promise(r=>setTimeout(r,250));
  }
  if(ac.state!=="running") throw new Error("音の準備ができません（動画を止めてから、もう一度お試しください）");
  const dest=ac.createMediaStreamDestination();
  const stream=new MediaStream([...cv.captureStream(fps).getVideoTracks(),...dest.stream.getAudioTracks()]);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1.2e6});
  const parts=[]; rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  const stopped=new Promise(r=>{rec.onstop=r;});
  // 動画クリップの下ごしらえ。返事が返らないことがあるので待ち時間を区切る
  const cap=(pr,ms)=>Promise.race([pr,new Promise(r=>setTimeout(r,ms))]);
  for(const c of tl) if(c.media&&c.media.kind==="video"){
    try{ await cap(c.media.el.play(),1500); c.media.el.pause(); }catch{}
    try{ c.media.el.currentTime=c.p.trimStart||0; }catch{}
  }
  draw(g,W,H,W/1280,tl[0].p,0);
  rec.start(1000);
  const t0=ac.currentTime+0.2;
  /* 進み具合は普通の時計（performance.now）で数える。
     音の土台が途中で止まっても、ここが止まらないので固まらない */
  const w0=performance.now()+200;
  for(const c of tl){ const a=voiceOf(c.p); if(!a||!a.buf) continue;
    const s=ac.createBufferSource();s.buffer=a.buf;
    if(useRec){ const gn=ac.createGain(); gn.gain.value=normGain(a.buf); s.connect(gn); gn.connect(dest); }
    else s.connect(dest);
    s.start(t0+c.start);}
  const started=new Set();
  let stopReason="";
  await new Promise(done=>{
    (function loop(){
      const t=(performance.now()-w0)/1000;
      // 音の土台が途中で止まったら、無言の動画になる前に打ち切る
      if(t>1&&ac.state!=="running"){ stopReason="音が途中で止まりました"; done(); return; }
      if(t>=T){done();return;}
      if(t>=0){
        let c=tl[0]; for(const x of tl) if(t>=x.start) c=x;
        if(c.media&&c.media.kind==="video"){
          if(!started.has(c.p.id)){started.add(c.p.id);
            c.media.el.currentTime=c.p.trimStart||0;c.media.el.play().catch(()=>{});}
          if(c.media.el.currentTime>=(c.p.trimEnd||c.media.dur)-0.05) c.media.el.pause();
        }
        draw(g,W,H,W/1280,c.p,t); prog(t/T);
      }
      requestAnimationFrame(loop);})();});
  for(const c of tl) if(c.media&&c.media.kind==="video") c.media.el.pause();
  rec.stop();
  await Promise.race([stopped,new Promise(r=>setTimeout(r,4000))]);
  if(stopReason) throw new Error(stopReason+"（動画を止めてから、もう一度お試しください）");
  if(!parts.length) throw new Error("録画データが空でした");
  return new Blob(parts,{type:mime.split(";")[0]});
}

let outFile=null, lastPCM=null, lastSR=48000, forceRec=false;
function finish(blob,T){
  const mb=blob.size/1048576;
  log(`完成：${mb.toFixed(1)} MB ／ ${fmt(T)}`,"s");
  if(mb>24) log("25MBを超えました。Gmailでは自動的にDriveリンクになります。","w");
  const name=(P.meta.title||"改善提案").replace(/[\\/:*?"<>|]/g,"_")+".mp4";
  outFile=new File([blob],name,{type:"video/mp4"});
  const v=$("#res"); $("#resbox").hidden=false; v.src=URL.createObjectURL(blob);
  $("#run-w").hidden=true;
  $("#run-a").hidden=false; $("#run-b").hidden=false; $("#run-c").hidden=false; $("#run-r").hidden=false;
  $("#a-snd").onclick=playMixed;
  $("#a-exp2").onclick=exportP;
  // 画面をタップで一時停止／もう一度タップで再生。下の「停止」で最初に戻して止める
  // 「内容を保存」は下の行（音だけ確認のとなり）に置いたので、上の行は出さない（v47）
  $("#run-v").hidden=false; $("#run-k").hidden=false; $("#run-io").hidden=true;
  $("#run-x").hidden=false; $("#run-b").hidden=false;
  $("#a-rec").onclick=()=>{ $("#run").hidden=true; openRec(); };
  $("#a-make").onclick=()=>runExport(recAll());
  $("#a-back").onclick=backToPages;
  v.onclick=()=>{ if(v.paused) v.play().catch(()=>{}); else v.pause(); };
  v.onplay=v.onpause=v.onended=resIcon;
  $("#a-stop").onclick=()=>{ v.pause(); try{ v.currentTime=0; }catch{} };
  v.play().catch(()=>{}); resIcon();
  $("#a-save").onclick=()=>sendVia("save");
  $("#a-mail").onclick=()=>sendVia("mail");
}
/* 動画の上に出す再生／一時停止のマーク。止まっている間は出したまま、
   再生中は少ししてから消える */
function resIcon(){
  const v=$("#res"), ic=$("#resic"); if(!ic) return;
  ic.textContent=v.paused?"▶":"❚❚";
  ic.classList.toggle("hide",!v.paused);
}
const canShareFile=f=>!!(navigator.canShare&&navigator.canShare({files:[f]}));

function pcmToWav(pcm,sr){
  const n=pcm.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const put=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
  put(0,"RIFF"); v.setUint32(4,36+n*2,true); put(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); put(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    let x=Math.max(-1,Math.min(1,pcm[i]));
    v.setInt16(44+i*2,x<0?x*0x8000:x*0x7FFF,true);
  }
  return new Blob([buf],{type:"audio/wav"});
}
let checkAudio=null;
function playMixed(){
  if(!lastPCM){ log("確認できる音声がありません","w"); return; }
  const url=URL.createObjectURL(pcmToWav(lastPCM,lastSR));
  if(!checkAudio){ checkAudio=new Audio(); checkAudio.setAttribute("playsinline",""); }
  checkAudio.src=url; checkAudio.play()
    .then(()=>log("動画に入れた音声そのものを再生しています。これが聞こえるなら音は作れています。","s"))
    .catch(e=>log("再生できません："+(e.message||e),"e"));
}

function saveAsFile(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(outFile); a.download=outFile.name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function sendVia(how){
  // 動画がまだ無いときは、黙って終わらずに理由を出す
  if(!outFile){
    tell("動画がまだありません","先に「動画を作る」を押して、動画を仕上げてください。");
    return;
  }
  // パソコンのメールはGmail側に宛先を渡せるので、コピーの案内は出さない
  if(isPC&&how==="mail"){ openMailPC(); return; }
  // 宛先のコピーは「待たずに」始める。ここで await するとiOSが
  // 「利用者の操作から離れた」と判断して共有シートを開かなくなる
  let copyP=null;
  if(how==="mail"&&S.mailTo){
    try{ copyP=navigator.clipboard.writeText(S.mailTo).then(()=>true,()=>false); }
    catch{ copyP=Promise.resolve(false); }
    $("#run-w").innerHTML=`宛先 <b>${esc(S.mailTo)}</b> をコピーしています…`;
    $("#run-w").hidden=false;
    copyP.then(ok=>{
      $("#run-w").innerHTML=ok
        ? `宛先 <b>${esc(S.mailTo)}</b> をコピーしました。<br>メールの「To」を${isPC?"クリックして貼り付け（Ctrl+V）":"長押し →「ペースト」"}で入ります。`
        : `メールの「To」に <b>${esc(S.mailTo)}</b> を入力してください。`;
      if(ok) log("宛先をコピーしました："+S.mailTo,"s");
    });
  }
  if(canShareFile(outFile)){
    try{
      await navigator.share({
        files:[outFile],
        title:P.meta.title||"改善提案",
        text:how==="mail"?(P.meta.title||"改善提案"):undefined,
      });
      log(how==="save"
        ?"共有メニューの「ビデオを保存」で写真アプリに入ります。"
        :"共有メニューのメールアプリを選ぶと動画が添付されます。","s");
      return;
    }catch(e){ if(e.name==="AbortError") return; log("共有できませんでした："+e.message,"w"); }
  }
  // 共有が使えないときは、ファイルとして保存する
  saveAsFile();
  log("動画をファイルとして保存しました："+outFile.name,"s");
  if(how==="mail") openMailPC(true);
}
/* パソコンから送るとき。動画はブラウザからは添付できない決まりなので、
   ①動画をダウンロードに保存 ②Gmail（またはメールソフト）を宛先入りで開く
   ③保存した動画を自分で添付してもらう、という流れにする */
function openMailPC(saved){
  const to  = S.mailTo||"";
  const sub = P.meta.title||"改善提案";
  const body= "改善提案の動画を送ります。\n（動画ファイル "+outFile.name+" を添付しています）";
  let win=null;
  if(S.mailApp!=="mailto"){
    // 開くのは押した直後でないとブラウザに止められるので、保存より先に開く
    const u="https://mail.google.com/mail/?view=cm&fs=1"
      +(to?"&to="+encodeURIComponent(to):"")
      +"&su="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body);
    win=window.open(u,"_blank","noopener");
  }
  if(!saved){ saveAsFile(); log("動画をファイルとして保存しました："+outFile.name,"s"); }
  if(S.mailApp!=="mailto"&&!win){
    log("Gmailの窓が開けませんでした。ブラウザのポップアップ許可をご確認ください。","w");
  }
  if(S.mailApp==="mailto"){
    location.href="mailto:"+encodeURIComponent(to)
      +"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body);
  }
  $("#run-w").innerHTML=
    `動画を <b>${esc(outFile.name)}</b> として保存しました（ダウンロードのフォルダ）。<br>`
    +`${S.mailApp==="mailto"?"メールソフト":"Gmail"}が開いたら、このファイルを添付して送ってください。`
    +(to?"":`<br>宛先は設定の「動画の送り先」に登録できます。`);
  $("#run-w").hidden=false;
}

/* ══════════ 12. 保存・読込（v29：素材ごと1つのZIPにまとめる） ══════════
   中身： project.json（文章・設定）／ media/… （写真・素材の動画）／ voice/… （録音した声）
   ZIPは「無圧縮（ストア）」で詰める。写真も動画も音声もすでに圧縮済みなので、
   これでサイズはほぼ元のまま、iPhoneでも詰め替えの負荷がほとんど出ない。 */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});

const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}
  return t;})();
// 大きい動画でもメモリを使い切らないよう、4MBずつ読んで計算する
async function crcOf(blob){
  let c=0xFFFFFFFF; const CH=4*1024*1024;
  for(let o=0;o<blob.size;o+=CH){
    const u=new Uint8Array(await blob.slice(o,Math.min(o+CH,blob.size)).arrayBuffer());
    for(let i=0;i<u.length;i++) c=CRCT[(c^u[i])&0xFF]^(c>>>8);
  }
  return (c^0xFFFFFFFF)>>>0;
}
function dosTime(d){
  return {t:((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,
          d:(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF};
}
// files=[{name,blob}] → 1つのZIPのBlob
async function makeZip(files,onStep){
  const enc=new TextEncoder(), now=dosTime(new Date()), parts=[], dir=[];
  let off=0, n=0;
  for(const f of files){
    const nm=enc.encode(f.name), sz=f.blob.size, crc=await crcOf(f.blob);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true);
    h.setUint16(8,0,true); h.setUint16(10,now.t,true); h.setUint16(12,now.d,true);
    h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer,nm,f.blob);
    dir.push({nm,crc,sz,off});
    off+=30+nm.length+sz;
    if(onStep) onStep(++n,files.length);
  }
  const cdOff=off, cd=[];
  for(const e of dir){
    const h=new DataView(new ArrayBuffer(46));
    h.setUint32(0,0x02014b50,true); h.setUint16(4,20,true); h.setUint16(6,20,true);
    h.setUint16(8,0x0800,true); h.setUint16(10,0,true);
    h.setUint16(12,now.t,true); h.setUint16(14,now.d,true);
    h.setUint32(16,e.crc,true); h.setUint32(20,e.sz,true); h.setUint32(24,e.sz,true);
    h.setUint16(28,e.nm.length,true); h.setUint16(30,0,true); h.setUint16(32,0,true);
    h.setUint16(34,0,true); h.setUint16(36,0,true); h.setUint32(38,0,true);
    h.setUint32(42,e.off,true);
    cd.push(h.buffer,e.nm); off+=46+e.nm.length;
  }
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(4,0,true); end.setUint16(6,0,true);
  end.setUint16(8,dir.length,true); end.setUint16(10,dir.length,true);
  end.setUint32(12,off-cdOff,true); end.setUint32(16,cdOff,true); end.setUint16(20,0,true);
  return new Blob([...parts,...cd,end.buffer],{type:"application/zip"});
}
// ZIPを開いて {名前 → Blob} にする（無圧縮／deflate の両方に対応）
async function readZip(file){
  const tail=new DataView(await file.slice(Math.max(0,file.size-66000)).arrayBuffer());
  const base=Math.max(0,file.size-66000);
  let e=-1;
  for(let i=tail.byteLength-22;i>=0;i--) if(tail.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0) throw new Error("ZIPとして読めませんでした");
  const cnt=tail.getUint16(e+10,true), cdOff=tail.getUint32(e+16,true), cdSize=tail.getUint32(e+12,true);
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());
  const dec=new TextDecoder(), out=new Map();
  let q=0;
  for(let i=0;i<cnt;i++){
    if(cd.getUint32(q,true)!==0x02014b50) break;
    const meth=cd.getUint16(q+10,true), csz=cd.getUint32(q+20,true);
    const nl=cd.getUint16(q+28,true), el=cd.getUint16(q+30,true), cl=cd.getUint16(q+32,true);
    const lo=cd.getUint32(q+42,true);
    const name=dec.decode(new Uint8Array(cd.buffer,q+46,nl));
    const lh=new DataView(await file.slice(lo,lo+30).arrayBuffer());
    const dOff=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    let b=file.slice(dOff,dOff+csz);
    if(meth===8){
      if(!window.DecompressionStream) throw new Error("この端末では圧縮されたZIPを開けません");
      b=await new Response(b.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
    }else if(meth!==0) throw new Error("対応していないZIPです");
    out.set(name,b);
    q+=46+nl+el+cl;
  }
  return out;
}
const extOf=t=>({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/heic":"heic","image/gif":"gif",
  "video/mp4":"mp4","video/quicktime":"mov","video/webm":"webm",
  "audio/mp4":"m4a","audio/mpeg":"mp3","audio/wav":"wav","audio/webm":"weba","audio/aac":"aac"}[t]||"bin");

/* 素材の動画を 720p 相当に詰め直す（メールで送れる大きさにするため）。
   完成する動画は 720p なので、これで仕上がりの見た目は変わらない。
   トリミングした範囲だけを取り出すので、読み込んだ側は頭から終わりまで使えばよい。
   音は入らない（完成動画では素材の音を使っていないため）。 */
async function shrinkVideo(el,t0,t1,onProg){
  if(!window.VideoEncoder) throw new Error("この端末では詰め直せません");
  if(!window.Mp4Muxer) await loadScript("https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.min.js");
  if(!window.Mp4Muxer) throw new Error("muxer読み込み失敗");
  const vw=el.videoWidth||1280, vh=el.videoHeight||720;
  const sc=Math.min(1,1280/Math.max(vw,vh));
  const ev=n=>Math.max(2,Math.round(n/2)*2);
  const W=ev(vw*sc), H=ev(vh*sc);
  const fps=Math.min(30,Number(S.fps)||30);
  const dur=Math.max(0.2,t1-t0);
  const M=window.Mp4Muxer;
  const muxer=new M.Muxer({target:new M.ArrayBufferTarget(),
    video:{codec:"avc",width:W,height:H},fastStart:"in-memory"});
  let err=null;
  const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{err=e;}});
  enc.configure({codec:"avc1.42001F",width:W,height:H,bitrate:1.6e6,framerate:fps});
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d",{alpha:false});
  try{ el.pause(); }catch{}
  const total=Math.max(1,Math.round(dur*fps));
  for(let i=0;i<total;i++){
    if(err) throw err;
    await seek(el,t0+i/fps,600);
    g.drawImage(el,0,0,W,H);
    const fr=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
    enc.encode(fr,{keyFrame:i%(fps*2)===0}); fr.close();
    if(enc.encodeQueueSize>8) await new Promise(r=>setTimeout(r,8));
    if(onProg&&i%10===0) onProg(i/total);
  }
  await enc.flush(); muxer.finalize();
  if(err) throw err;
  return {blob:new Blob([muxer.target.buffer],{type:"video/mp4"}),dur};
}
const slideName=p=>{

async function exportP(){
  if(zipBusy){ log("いま内容ファイルを作っています。そのままお待ちください。","w"); return; }
  zipBusy=true;
  /* 完成した動画や音を鳴らしたままだと、iPhoneでは動画の詰め直し（seek）が
     進まなくなって止まったように見えるので、先に止める */

    for(const p of proj.pages){ p.trimStart=p.trimStart||0; p.trimEnd=p.trimEnd||0; }

    // スライドの並び順（結びのページは入れない）。この番号を素材の動画の名前にも使う

       ここに置いた1つを読み込みにも使うので、同じ動画が2重に入ってZIPが太ることはない。 */
    const done=new Set(), vidNote=[];
    for(const p of slidePages) if(p.mediaId&&!done.has(p.mediaId)){
      done.add(p.mediaId);
      const b=(media.get(p.mediaId)||{}).blob||await getB(p.mediaId);
      if(!b) continue;
      const mm=media.get(p.mediaId)||{};
      const isVid=(b.type||"").startsWith("video/")||mm.kind==="video";
      if(!isVid){
        const name="media/"+p.mediaId+"."+extOf(b.type);
        files.push({name,blob:b});
        mediaList.push({id:p.mediaId,name,type:b.type||"application/octet-stream"});
        continue;
      }
      /* 動画は 8MB を超えていたら 720p に詰め直してから入れる（メールで送れる大きさにする）。
         同じ動画を2ページで使っているときは、切り出す範囲が決められないのでそのまま入れる。 */
      let vb=b, vtype=b.type||"video/mp4", shrunk=false, shrinkErr="";
      const t0=p.trimStart||0, t1=(p.trimEnd||mm.dur||0)||((mm.el&&mm.el.duration)||0);
      const usedBy=P.pages.filter(q=>q.mediaId===p.mediaId).length;
      const ck=p.mediaId+":"+t0.toFixed(2)+":"+t1.toFixed(2);
      if(mm.el&&b.size>8*1024*1024&&usedBy===1&&t1>t0){
        const hit=shrunkCache.get(ck);
        if(hit){                                   // 前に詰め直したものをそのまま使う（v48）
          vb=hit.blob; vtype="video/mp4"; shrunk=true;
          for(const q of proj.pages) if(q.mediaId===p.mediaId){ q.trimStart=0; q.trimEnd=hit.dur; }
        }else try{
          expBusy("動画を軽くしています…");
          log("動画を軽くしています（少し時間がかかります）…");
          const r=await shrinkVideo(mm.el,t0,t1,pr=>expBusy(`動画を軽くしています… ${Math.round(pr*100)}%`));
          if(r&&r.blob&&r.blob.size<b.size){
            vb=r.blob; vtype="video/mp4"; shrunk=true;
            shrunkCache.set(ck,{blob:r.blob,dur:r.dur});
            for(const q of proj.pages) if(q.mediaId===p.mediaId){ q.trimStart=0; q.trimEnd=r.dur; }
          }
        }catch(e){ shrinkErr=(e&&e.message)||String(e); log("動画を軽くできませんでした："+shrinkErr,"w"); }
        expBusy("まとめています…");
      }
      const name=`パワーポイント用/${no(p)}_${slideName(p)}.${shrunk?"mp4":extOf(b.type)}`;
      files.push({name,blob:vb});
      mediaList.push({id:p.mediaId,name,type:vtype});
      vidNote.push(`${no(p)} ページ目：${name.split("/")[1]}`+
        (shrunk?`（使う範囲だけを 720p に詰め直しました。${(vb.size/1048576).toFixed(1)} MB・音は入っていません）`
               :shrinkErr?`（軽くできなかったのでそのまま入れました：${shrinkErr}）`
               :((p.trimStart||p.trimEnd)?`（動画の ${t0.toFixed(1)} 秒〜${t1.toFixed(1)} 秒を使っています）`:"")));
    }
    // 結びのページだけで使っている素材があれば、そちらは今まで通り media に入れる
    for(const p of P.pages) if(p.mediaId&&!done.has(p.mediaId)){
      done.add(p.mediaId);
      const b=(media.get(p.mediaId)||{}).blob||await getB(p.mediaId);
      if(!b) continue;
      const name="media/"+p.mediaId+"."+extOf(b.type);
      files.push({name,blob:b}); mediaList.push({id:p.mediaId,name,type:b.type||"application/octet-stream"});
    }
    // 録音した自分の声
    for(const p of P.pages) if(p.rec){
      const r=rec.get(p.id); const b=(r&&r.blob)||await getB("rec:"+p.id);
      if(!b) continue;
      const name="voice/"+p.id+"."+extOf(b.type);
      files.push({name,blob:b}); recList.push({pageId:p.id,name,type:b.type||"audio/mp4",dur:Number(p.recDur)||0});

    }

    files.push({name:"パワーポイント用/はじめにお読みください.txt",
      blob:new Blob(["\ufeff"+[
        "【パワーポイントへの入れ方】",
        "",
        "1. パワーポイントで 挿入 → フォトアルバム → ファイル/ディスク",
        "2. このフォルダの .jpg を全部選ぶ（番号順に並びます）",
        "3. 「画像のレイアウト」を「スライドに合わせる」にして 作成",
        "",
        vidNote.length?"【動画のページ】":"",
        vidNote.length?"このフォルダに動画ファイルも入っています。上の手順では入らないので、":"",
        vidNote.length?"その番号のスライドを開いて 挿入 → ビデオ → このデバイス で入れてください。":"",
        vidNote.length?"（写真アルバムで入る絵は、動画の1コマを写したものです）":"",
        ...vidNote,
        "",
        "※ iPhoneの動画が再生できないときは、iPhoneの 設定 → カメラ → フォーマット を",
        "　 「互換性優先」にして撮り直すと確実です。",
      ].filter(x=>x!==null).join("\r\n")],{type:"text/plain"})});

    const out={v:3,app:"teian-video",settings:{...S,ttsKey:""},project:proj,
      files:{media:mediaList,rec:recList,slides:sn}};
    files.unshift({name:"project.json",blob:new Blob([JSON.stringify(out)],{type:"application/json"})});
    const zip=await makeZip(files,(i,n)=>expBusy(`まとめています… ${i}/${n}`));
    const base=((P.meta.title||"改善提案").replace(/[\\/:*?"<>|]/g,"_"));

/* 出来上がったZIPを渡す（v48）
   iPhoneの共有メニューは「ボタンを押した直後」でないと開かない決まりで、
   まとめるのに何十秒もかかると、そのあとの共有は黙って断られていた。
   （断られたあとのダウンロードも、ホーム画面から開いたアプリでは何も起きない）
   そこで、まとめ終わってからもう一度押してもらい、その中で共有メニューを開く。 */
function dlZip(f){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(f); a.download=f.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
  log("内容ファイルを保存しました："+f.name,"s");
}
function deliverZip(f){
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[f]}));
  if(!ZIP_ASK_ENABLE||isPC||!canShare){ dlZip(f); return Promise.resolve(); }
  return new Promise(res=>{
    $("#ask-t").textContent="内容がまとまりました";
    $("#ask-m").textContent=
      `${f.name}\n（${(f.size/1048576).toFixed(1)} MB）\n\n`+
      "「保存・送る」を押すと共有メニューが開きます。\n"+
      "「"+'"'+"ファイル"+'"'+"に保存」やメールを選んでください。";
    $("#ask-y").textContent="保存・送る";
    $("#ask-n").textContent="やめる";
    $("#ask-n").hidden=false;
    $("#ask").hidden=false;
    const fin=()=>{ $("#ask").hidden=true; $("#ask-y").onclick=null; $("#ask-n").onclick=null; res(); };
    $("#ask-n").onclick=()=>{ log("保存をやめました。","w"); fin(); };
    $("#ask-y").onclick=()=>{        // ← 押した直後に開くことが大事。ここで await しない
      $("#ask").hidden=true;
      navigator.share({files:[f],title:f.name}).then(
        ()=>log("共有メニューを開きました。","s"),
        e=>{ if(e&&e.name==="AbortError"){ log("保存をやめました。","w"); return; }
             log("共有できませんでした："+((e&&e.message)||e)+"　ファイルとして保存します。","w");
             dlZip(f); });
      fin();
    };
  });
}

async function importP(file){
  const isZip=/\.zip$/i.test(file.name)||file.type==="application/zip"||file.type==="application/x-zip-compressed";
  let j,entries=null;
  try{
    if(isZip){
      entries=await readZip(file);
      const pj=entries.get("project.json");
      if(!pj) throw new Error("中身が見つかりません");
      j=JSON.parse(await pj.text());
    }else{
      j=JSON.parse(await file.text());
    }
  }catch(e){ return tell("読み込めませんでした","このファイルは発表の内容ファイルではないようです。\n"+((e&&e.message)||"")); }
  if(!j||!j.project||!Array.isArray(j.project.pages)||!j.project.pages.length)
    return tell("読み込めませんでした","このファイルには発表の内容が入っていません。");
  const withMedia=!!(entries&&j.files);
  if(!await ask("ファイルから読み込む",
    "いま入力してある内容をすべて置き換えます。元には戻せません。\n"+
    (withMedia?"写真・動画・録音した声もファイルの中身に入れ替わります。\n":"写真・動画・録音した声は消えます。\n")+
    "\n音声のAPIキーだけはこの端末のものを使います。",
    "読み込む")) return;
  S={...DEFAULTS,...j.settings,ttsKey:S.ttsKey};
  for(const id of [...media.keys()]) dropMedia(id);
  media.clear(); audio.clear(); rec.clear(); useRec=false;
  try{ await idb("readwrite",s=>s.clear()); }catch{}
  P=j.project; migrate();
  if(withMedia){
    for(const m of (j.files.media||[])){
      const e=entries.get(m.name); if(!e) continue;
      const blob=await putSolid(m.id,e,m.type||"");
      // 本当に端末へ写せたか、その場で読み返して確かめる
      let ok=false; try{ const c=await getB(m.id); ok=!!c&&c.size===blob.size; }catch{}
      if(!ok) log(`「${m.name}」をこの端末に保存できませんでした（空き容量をご確認ください）`,"w");
      await link(m.id,blob,(m.type||"").startsWith("video/")?"video":"image");
    }
    const got=new Set((j.files.media||[]).map(m=>m.id));
    for(const p of P.pages) if(p.mediaId&&!got.has(p.mediaId)) p.mediaId=null;
    const rl=new Map((j.files.rec||[]).map(r=>[r.pageId,r]));
    for(const p of P.pages){
      const r=rl.get(p.id), b=r&&entries.get(r.name);
      if(r&&b){ const blob=await putSolid("rec:"+p.id,b,r.type||"audio/mp4");
        rec.set(p.id,{blob,buf:null,dur:Number(r.dur)||Number(p.recDur)||0});
        p.rec=true; p.recDur=Number(r.dur)||Number(p.recDur)||0;
      }else{ p.rec=false; p.recDur=0; }
    }
  }else{
    for(const p of P.pages){ delete p.rec; delete p.recDur; }
    if(j.media&&Object.keys(j.media).length){        // 古い形式（写真も入っているファイル）
      for(const [id,u] of Object.entries(j.media)){
        try{
          const b0=await(await fetch(u)).blob();
          const b=await putSolid(id,b0,b0.type);
          await link(id,b,b.type.startsWith("video/")?"video":"image");
        }catch{}
      }
    }else{
      for(const p of P.pages) p.mediaId=null;        // 文字だけのファイル＝写真は入れ直してもらう
    }
  }
  mk=false; cur=0; outFile=null; save(); $("#sheet").hidden=true; paint();
}

/* ══════════ 12b. 自分の声で録音 ══════════ */
let recCur=0, recStream=null, recorder=null, recBits=[], recTimer=null, recT0=0, recPlay=null;
const needSay=p=>!!speechOf(p);
const recLeft=()=>P.pages.filter(p=>needSay(p)&&!rec.has(p.id));
const recName=p=>p.kind==="content"
  ?(headText(p)||(isSum(p)?"まとめ":"ページ"))
  :KINDS[p.kind].n;

function openRec(){
  useRec=true;
  const i=P.pages.findIndex(needSay);      // 読み上げのある最初のページから
  recCur=i<0?0:i;
  $("#rc").hidden=false; keepAwake(true); paintRec();
}
async function closeRec(){
  await stopMic(true);
  useRec=false; $("#rc").hidden=true; keepAwake(false); paint();
  if(mk) showRunReady();
}
function paintRec(){
  const p=P.pages[recCur]; if(!p) return;
  const say=speechOf(p);
  const all=P.pages.filter(needSay).length;
  const ok=P.pages.filter(x=>needSay(x)&&rec.has(x.id)).length;
  $("#rc-nm").textContent=recName(p);
  $("#rc-ct").textContent=`${recCur+1} / ${P.pages.length} ページ　　録音できたページ ${ok} / ${all}`;
  renderTo($("#rc-pv"),p,0);
  const tx=$("#rc-tx");
  tx.className="rctx"+(say?"":" none");
  tx.textContent=say||"このページは読み上げがありません（無音のまま表示されます）。そのまま「次へ」に進んでください。";
  const r=rec.get(p.id);
  const mic=$("#rc-mic");
  mic.classList.remove("on");
  mic.textContent="● 録音開始"; mic.disabled=false;
  $("#rc-mics").hidden=!say;
  $("#rc-play").disabled=!r; $("#rc-redo").disabled=!r;
  $("#rc-imp").hidden=!say; $("#rc-imp").disabled=false;
  $("#rc-st").textContent=!say?"":r?`録音できています（${r.dur?r.dur.toFixed(1)+"秒":"読み込み待ち"}）`
                                   :"上の文を読み上げます。「録音開始」を押してから話してください。";
  const last=recCur===P.pages.length-1;
  const nx=$("#rc-next");
  nx.textContent=last?"動画作成へ":"次へ";
  nx.className=last?"mk":"go";
  nx.disabled=false; $("#rc-prev").disabled=recCur===0; $("#rc-x").disabled=false;
  $(".rcmain").scrollTop=0;
}
function recBusy(on){
  $("#rc-next").disabled=on; $("#rc-prev").disabled=on||recCur===0; $("#rc-x").disabled=on;
  $("#rc-imp").disabled=on;
}
async function micStart(){
  const p=P.pages[recCur];
  const mic=$("#rc-mic");
  mic.disabled=true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    mic.disabled=false;
    $("#rc-st").innerHTML="<b>マイクが使えません</b>　ファイルを直接開いた状態（file://）では"+
      "ブラウザがマイクを許可しません。<br>下の「音声ファイルを読み込む」を使うか、"+
      "付属の起動ファイル（teian-start.bat）から開いてください。";
    return;
  }
  try{
    if(!recStream) recStream=await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){
    mic.disabled=false;
    $("#rc-st").innerHTML="<b>マイクを使えません</b>　"+esc(e.message||"")+
      (isPC?"<br>ブラウザのアドレス欄の左にある鍵マークから、マイクを「許可」にしてください。"
           :"<br>設定＞Safari＞マイク の許可をご確認ください。");
    return;
  }
  mic.disabled=false;
  const cand=["audio/mp4","audio/mp4;codecs=mp4a.40.2","audio/webm;codecs=opus","audio/webm"];
  const mime=cand.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
  try{ recorder=new MediaRecorder(recStream,mime?{mimeType:mime}:undefined); }
  catch{ try{ recorder=new MediaRecorder(recStream); }catch(e){
    $("#rc-st").textContent="この端末では録音できません："+(e.message||e); return; } }
  recBits=[];
  recorder.ondataavailable=e=>{ if(e.data&&e.data.size) recBits.push(e.data); };
  recorder.onstop=()=>finishTake(p);
  try{ recorder.start(); }catch(e){ $("#rc-st").textContent="録音を始められません："+(e.message||e); return; }
  recT0=Date.now();
  mic.classList.add("on"); mic.textContent="■ 録音停止";
  $("#rc-play").disabled=true; $("#rc-redo").disabled=true;
  const tick=()=>{ $("#rc-st").innerHTML=
    `<b>● 録音中 ${Math.floor((Date.now()-recT0)/1000)}秒</b>　読み終わったら「停止」を押してください`; };
  tick(); clearInterval(recTimer); recTimer=setInterval(tick,250);
  recBusy(true);
}
function micStop(){
  if(!recorder||recorder.state!=="recording") return;
  clearInterval(recTimer);
  const mic=$("#rc-mic");
  mic.classList.remove("on"); mic.disabled=true; mic.textContent="取り込んでいます…";
  $("#rc-st").textContent="";
  try{ recorder.stop(); }catch{}
}
// 同じボタンで 録音開始 ⇔ 録音停止
function micToggle(){
  if(recorder&&recorder.state==="recording") micStop(); else micStart();
}
async function finishTake(p){
  clearInterval(recTimer);
  const type=((recorder&&recorder.mimeType)||"audio/mp4").split(";")[0];
  const blob=new Blob(recBits,{type}); recBits=[];
  recBusy(false);
  if(!blob.size){ $("#rc-st").textContent="音が入っていませんでした。もう一度お試しください。"; paintRec(); return; }
  try{
    const buf=await AC().decodeAudioData(await blob.arrayBuffer());
    rec.set(p.id,{blob,buf,dur:buf.duration});
    p.rec=true; p.recDur=buf.duration;
    try{ await putB("rec:"+p.id,blob); }catch{}
    save();
  }catch(e){
    $("#rc-st").textContent="録音を取り込めませんでした："+(e.message||e);
    paintRec(); return;
  }
  paintRec();
}
/* マイクが使えない環境（会社のPCなど）向け：
   Windowsの「サウンドレコーダー」やiPhoneの「ボイスメモ」で録った音声ファイルを
   そのページの声として読み込む。マイクの許可がいらないので file:// でも使える。 */
let lastVoiceH=null;
async function pickVoice(){
  const p=P.pages[recCur];
  if(!speechOf(p)) return;
  if(canFS()){
    const opt={multiple:false,id:"teian-voice",types:[{description:"音声ファイル",
      accept:{"audio/*":[".m4a",".mp3",".wav",".aac",".ogg",".webm",".mp4",".flac"]}}]};
    if(lastVoiceH) opt.startIn=lastVoiceH;
    let hs;
    try{ hs=await window.showOpenFilePicker(opt); }
    catch(e){ if(e&&e.name==="AbortError") return;
      try{ delete opt.startIn; hs=await window.showOpenFilePicker(opt); }catch{ return; } }
    if(!hs||!hs.length) return;
    lastVoiceH=hs[0];
    try{ await putB("lastVoice",lastVoiceH); }catch{}
    await useVoiceFile(p,await hs[0].getFile());
  }else{
    const inp=$("#fpa"); inp.dataset.pid=p.id; inp.click();
  }
}
async function useVoiceFile(p,f){
  if(!f) return;
  $("#rc-st").textContent="音声ファイルを読み込んでいます…";
  try{
    const buf=await AC().decodeAudioData(await f.arrayBuffer());
    rec.set(p.id,{blob:f,buf,dur:buf.duration});
    p.rec=true; p.recDur=buf.duration;
    try{ await putB("rec:"+p.id,f); }catch{}
    save(); paintRec();
    $("#rc-st").textContent=`音声ファイルを取り込みました（${buf.duration.toFixed(1)}秒）`;
  }catch(e){
    $("#rc-st").textContent="この音声ファイルは読み込めませんでした："+(e.message||e);
  }
}

async function stopMic(discard){
  clearInterval(recTimer);
  if(recorder&&recorder.state==="recording"){
    if(discard) recorder.onstop=null;
    try{ recorder.stop(); }catch{}
  }
  recorder=null; recBits=[];
  if(recStream){ recStream.getTracks().forEach(t=>{try{t.stop();}catch{}}); recStream=null; }
  if(recPlay){ try{ recPlay.pause(); }catch{} }
}
function recHear(){
  const r=rec.get(P.pages[recCur].id); if(!r) return;
  if(!recPlay){ recPlay=new Audio(); recPlay.setAttribute("playsinline",""); }
  try{ recPlay.pause(); }catch{}
  recPlay.src=URL.createObjectURL(r.blob);
  recPlay.play().then(()=>$("#rc-st").textContent="再生しています…")
    .catch(e=>$("#rc-st").textContent="再生できません："+(e.message||e));
}
async function recRedo(){
  if(recorder&&recorder.state==="recording") return;
  const p=P.pages[recCur];
  if(!rec.has(p.id)) return;
  rec.delete(p.id); p.rec=false; p.recDur=0;
  try{ await delB("rec:"+p.id); }catch{}
  save(); paintRec();
  $("#rc-st").textContent="録音を消しました。もう一度「録音開始」を押してください。";
}
function recGo(d){
  if(recorder&&recorder.state==="recording") return;
  const n=recCur+d;
  if(n<0||n>=P.pages.length) return;
  recCur=n; paintRec();
}
async function recNext(){
  if(recorder&&recorder.state==="recording") return;
  if(recCur<P.pages.length-1){ recGo(1); return; }
  const left=recLeft();
  if(left.length){
    const go1=await ask("録音がまだのページがあります",
      `あと ${left.length} ページの録音が残っています。\n全部そろってから動画にします。`,"そのページへ");
    if(go1){ recCur=P.pages.indexOf(left[0]); paintRec(); }
    return;
  }
  await stopMic(true);
  $("#rc").hidden=true; keepAwake(false);
  mk=true; paint(); showRunReady();
}
$("#rc-mic").onclick=micToggle;
$("#rc-imp").onclick=pickVoice;
$("#fpa").onchange=async e=>{
  const p=P.pages.find(x=>x.id===e.target.dataset.pid);
  const f=e.target.files[0];
  e.target.value="";
  if(p&&f) await useVoiceFile(p,f);
};
$("#rc-play").onclick=recHear;
$("#rc-redo").onclick=recRedo;
$("#rc-prev").onclick=()=>recGo(-1);
$("#rc-next").onclick=recNext;
$("#rc-x").onclick=async()=>{
  if(recorder&&recorder.state==="recording") return;
  if(await ask("録音をやめますか",
    "ここまでに録音した声は残しておきます。あとで「録音する」を押せば続きから録音できます。",
    "やめる","録音を続ける")) closeRec();
};

/* ══════════ 13. 配線 ══════════ */
function log(t,c){const l=$("#lg"),d=document.createElement("div");if(c)d.className=c;
  d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;}
const st=t=>$("#run-s").textContent=t;
function ringLabel(t){
  const e=$("#pct").querySelector(".lb");
  if(e) e.textContent=t||"";
}
function setPct(p){
  p=Math.max(0,Math.min(1,p));
  $("#pct").querySelector(".nm").textContent=Math.round(p*100)+"%";
  $("#arc").setAttribute("stroke-dashoffset",364.4*(1-p));
}
$("#b-prev").onclick=()=>stepBy(-1);
$("#b-set").onclick=openSettings;
$("#sheet").onclick=e=>{if(e.target.id==="sheet")  {$("#sheet").hidden=true;paint();}};
$("#zoom").onclick=()=>$("#zoom").hidden=true;
$("#a-close").onclick=()=>{useRec=false;$("#run-b").hidden=true;$("#run-c").hidden=true;$("#run-r").hidden=true;forceRec=false;backToPages();};
$("#a-reset").onclick=()=>resetAll();
$("#pp").onchange=e=>e.target.files[0]&&importP(e.target.files[0]);
$("#fp").onchange=async e=>{
  const p=P.pages.find(x=>x.id===e.target.dataset.pid);
  if(p&&e.target.files[0]) await attachFile(p,e.target.files[0]);
  e.target.value=""; save(); paint();};
$("#fpm").onchange=async e=>{
  const p=P.pages.find(x=>x.id===e.target.dataset.pid);
  if(p){ let anchor=p;
    for(const f of e.target.files){ const np=await attachFile(p,f,anchor); if(np) anchor=np; }
    cur=P.pages.indexOf(anchor);
  }
  e.target.value=""; save(); paint();};

/* パソコン用のキー操作。文字を打っている最中は何もしない */
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if(!$("#ask").hidden||!$("#sheet").hidden) return;
  if(!$("#rc").hidden){                       // 録音の画面
    if(e.key===" "||e.key==="Enter"){ if(!$("#rc-mics").hidden){ e.preventDefault(); micToggle(); } }
    else if(e.key==="ArrowRight"){ e.preventDefault(); recNext(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); recGo(-1); }
    return;
  }
  if(!$("#run").hidden){
    if((e.key==="ArrowLeft"||e.key==="Escape")&&!running){ e.preventDefault(); backToPages(); }
    return;
  }
  if(e.key==="ArrowRight"){ e.preventDefault(); stepBy(1); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); stepBy(-1); }
});

function unlockAudio(){
  try{
    const ac=AC(); ac.resume();
    const b=ac.createBuffer(1,1,22050);
    const s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
  }catch{}
  document.removeEventListener("touchend",unlockAudio);
  document.removeEventListener("click",unlockAudio);
}
document.addEventListener("touchend",unlockAudio,{once:false});
document.addEventListener("click",unlockAudio,{once:false});

(async function(){
  /* iPhoneは「しばらく使っていないサイト」の保存領域を勝手に片づけることがある。
     これを申請しておくと、写真・動画が消されにくくなる（v41） */
  try{
    if(navigator.storage&&navigator.storage.persist){
      const ok=await navigator.storage.persisted?.()||false;
      if(!ok) await navigator.storage.persist();
    }
  }catch{}
  await openDB(); load(); await restore();
  paint();
  if(lostMedia.size){
    const n=P.pages.filter(isLost).length;
    setTimeout(()=>tell("写真・動画が見つかりません",
      `${n}ページ分の写真・動画が、この端末の保存場所から消えていました。\n`
      +"文章はそのまま残っています。該当のページを開いて入れ直すか、\n"
      +"「内容を読込」で保存しておいたファイルから戻してください。"),400);
  }
  if(!S.ttsKey) setTimeout(async()=>{
    if(await ask("音声の設定","最初に音声のAPIキーを設定しますか？\n（あとで設定からでも入力できます）","設定を開く")) openSettings();
  },600);
})();
</script>
