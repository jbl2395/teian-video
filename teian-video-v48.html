<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161b1f">
<title>改善提案 動画メーカー</title>
<style>
:root{
  --paper:#eceee9; --card:#fff; --ink:#161b1f; --ink2:#3c464e; --muted:#6d7780;
  --rule:#ccd1cb; --rule2:#e0e4de; --go:#1f7a4d; --go-bg:#e8f3ec;
  --stamp:#b03a2b; --warn:#c2591b;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","BIZ UDPGothic",sans-serif;
  font-size:15px;line-height:1.6;display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
.mono{font-family:"SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ═══ ヘッダ ═══ */
header{
  flex:0 0 auto;padding:calc(var(--sat) + 8px) 14px 8px;
  background:var(--ink);color:#f0f2ee;display:flex;align-items:center;gap:10px;
}
header .t{font-size:14px;font-weight:600;letter-spacing:.04em}
header .sp{flex:1}
header button{
  background:none;border:1px solid #3a444b;color:#c3cbd0;border-radius:6px;
  padding:5px 11px;font-size:12px;
}
header button:active{background:#2a333a}

/* ═══ 尺バー ═══ */
.gauge{flex:0 0 auto;background:#e4efe5;padding:7px 14px 8px;border-bottom:1px solid #cadfcd}
.gline{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.gline b{font-weight:600;color:var(--ink);font-size:13px}
.gline .over{color:var(--warn)}
.gbar{position:relative;height:14px;background:#f2f7f2;border:1px solid #b6d6bd;border-radius:7px;overflow:hidden;display:flex}
.gbar .sg{min-width:2px;border-right:1px solid rgba(255,255,255,.85)}
.gbar .sg[data-k=photo]{background:#3f9e69}
.gbar .sg[data-k=movie]{background:#1f7a4d}
.gbar .sg[data-k=slide]{background:#72c295}
.gbar .sg[data-k=mute]{background:#aed7bb}
.gbar .rest{flex:1}
.gbar .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn);opacity:.85}

/* ═══ ページ送り ═══ */
.pager{flex:0 0 auto;background:var(--paper);padding:8px 10px 4px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;white-space:nowrap;border-bottom:1px solid var(--rule2)}
.pg{
  display:inline-flex;flex-direction:column;align-items:center;gap:3px;width:52px;
  background:none;border:none;padding:0;vertical-align:top;
}
.pg .d{
  width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);
}
.pg .l{font-size:9.5px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:52px}
.pg[data-s=done] .d{border-color:var(--stamp);color:var(--stamp);background:#f7efed;font-size:11px}
.pg[data-s=cur] .d{background:var(--go);border-color:var(--go);color:#fff;transform:scale(1.1)}
.pg[data-s=cur] .l{color:var(--ink);font-weight:700}

/* ═══ 本体 ═══ */
/* 尺バー・ページャ・資料の欄までが固定。その下の入力欄だけがスクロールする */
.stage{flex:0 0 auto;background:var(--paper);padding:7px 12px 8px;
  border-bottom:1px solid var(--rule2);box-shadow:0 5px 8px -8px rgba(20,26,22,.5)}
.stage.out{opacity:0;transform:translateX(-8%)}
.stage.outR{opacity:0;transform:translateX(8%)}
.stage{transition:transform .22s,opacity .22s}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 14px}
.slide{transition:transform .22s,opacity .22s}
.slide.out{opacity:0;transform:translateX(-8%)}
.slide.outR{opacity:0;transform:translateX(8%)}

.head{display:flex;align-items:center;gap:9px;margin:0 0 8px 2px}
.head h1{font-size:17px;margin:0;font-weight:700;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .sub{font-size:11px;color:var(--muted);flex:0 0 auto}

/* 資料プレビュー */
.paper{
  width:100%;aspect-ratio:16/9;background:#fbfbf8;border:1px solid #b3b9b2;border-radius:6px;
  display:block;box-shadow:0 2px 10px rgba(20,26,22,.12);
}
.tapzone{position:relative}
.tapzone .hintbox{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;pointer-events:none;color:var(--muted);
}
.tapzone .hintbox .ic{font-size:30px;line-height:1}
.tapzone .hintbox .tx{font-size:12.5px}
/* 「写真を変える」は資料の右上に重ねる */
.chgbtn{
  position:absolute;top:8px;right:9px;z-index:2;
  background:rgba(22,27,31,.78);color:#fff;border:none;
  border-radius:14px;padding:5px 13px;font-size:11.5px;line-height:1.3;
}

/* 動画作成ページ（v24）。動画には入らない作業用の画面 */
.mkbox{width:100%;aspect-ratio:16/9;background:#fbfbf8;border:1px dashed #b3b9b2;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px}
.mkbox .ttl{font-size:19px;font-weight:700;color:var(--go)}
.mkbox .sub{font-size:12.5px;color:var(--ink2)}
.mkbox .sub2{font-size:12px;color:var(--muted);line-height:1.8}

/* カード */
/* 見出し欄：タップするとそのまま書ける／右端の正方形ボタンで候補から選ぶ */
.labrow{display:flex;gap:8px;align-items:stretch}
.labrow input{flex:1;min-width:0}
.labrow input:focus{border-color:var(--go);box-shadow:0 0 0 3px var(--go-bg)}
.labbtn{position:relative;flex:0 0 auto;width:52px;border:1.5px solid var(--rule);
  border-radius:6px;background:#f7f8f6;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--ink2);line-height:1}
.labbtn:active{background:var(--go-bg);border-color:var(--go);color:var(--go)}
.labbtn select{position:absolute;inset:0;width:100%;height:100%;padding:0;
  opacity:0;border:none;background:none;-webkit-appearance:none;appearance:none}
/* 細長い＋は廃止（v11）。ページを増やすのは下の「次へ」ボタン */
.card{background:var(--card);border:1px solid var(--rule2);border-radius:8px;padding:12px;margin-top:10px}
.card > h3{margin:0 0 9px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
label.f,div.f{display:block;margin-bottom:10px}
label.f:last-child,div.f:last-child{margin-bottom:0}
label.f > span,div.f > span{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:4px}
label.f > span em,div.f > span em{font-style:normal;font-weight:400;color:var(--muted);font-size:10.5px;margin-left:5px}
input,textarea,select{
  width:100%;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:10px 11px;
  -webkit-appearance:none;appearance:none;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,textarea:focus,select:focus{outline:2px solid var(--go);outline-offset:-2px;border-color:var(--go)}
input[type=color]{height:46px;padding:4px 5px}
textarea{min-height:64px;resize:none;line-height:1.65}
.show textarea{background:#fffdf5;border-color:#ddd5bd}
.say textarea{background:#f4faf6;border-color:#c4ddd0}
input[type=number],.num{font-family:"SF Mono",ui-monospace,monospace;text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g2 label.f,.g2 div.f{margin-bottom:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  flex:1;min-width:0;border:1px solid var(--rule);background:#fff;border-radius:7px;
  padding:8px 4px;font-size:11.5px;text-align:center;color:var(--ink2);
}
.chip[aria-pressed=true]{background:var(--go-bg);border-color:var(--go);color:var(--go);font-weight:700}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.hint code{background:#eef0ec;padding:1px 5px;border-radius:3px;font-size:11px;user-select:all}
.rowbtns{display:flex;gap:8px;margin-top:10px}
.sm{flex:1;background:#fff;border:1px solid var(--rule);border-radius:7px;padding:9px 4px;font-size:12.5px;color:var(--ink2)}
.sm:active{background:#f0f2ee}
.sm.warn{color:var(--stamp);border-color:#e0c4bf}
.formula{background:#f5f8f4;border:1px solid var(--rule2);border-left:3px solid var(--go);
  border-radius:6px;padding:10px 12px;margin-top:10px}
.formula .ln{font-size:11.5px;color:var(--ink2);margin-bottom:3px;font-family:"SF Mono",ui-monospace,monospace}
.formula .amt{margin-top:7px;padding-top:7px;border-top:1px solid var(--rule2)}
.formula .amt b{font-size:26px;font-weight:700;color:var(--go);font-family:"SF Mono",ui-monospace,monospace}
.formula .amt span{font-size:11px;color:var(--muted);margin-left:6px}
.formula .why{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule2);
  font-size:11.5px;color:var(--warn);line-height:1.7}
.formula .why b{display:block;font-size:11px;letter-spacing:.06em;margin-bottom:3px}
.formula .why button{margin-top:6px;font:inherit;color:var(--go);background:#fff;
  border:1px solid var(--rule2);border-radius:7px;padding:5px 11px}

/* ═══ フッタ ═══ */
footer{
  flex:0 0 auto;background:var(--card);border-top:1px solid var(--rule);
  padding:9px 12px calc(var(--sab) + 9px);display:flex;gap:9px;align-items:center;
}
.nb{flex:0 0 auto;background:#fff;border:1px solid var(--rule);border-radius:9px;padding:12px 18px;font-size:15px}
.nb:disabled{opacity:.3}
.nb.go{flex:1;background:var(--go);border-color:var(--go);color:#fff;font-weight:700}
/* 「←」と「削除」は同じ大きさ（v43） */
#b-prev,.nb.del{min-width:66px;padding-left:12px;padding-right:12px;text-align:center}
.nb.del{background:#c0392b;border-color:#c0392b;color:#fff;font-weight:700}
.nb.del:active{background:#98291c}
.nb.del[hidden]{display:none}
.nb.go:active{background:#186040}
.nb.big{flex:1;background:var(--go);border-color:var(--go);color:#fff;font-weight:700;padding:14px}
/* 効果（金額）以降へ飛ぶボタン。「次へ」の横に置く */
.nb.jump{background:var(--go-bg);border-color:var(--go);color:var(--go);font-weight:700;padding:12px 14px}
.nb.jump:active{background:#d5e9dd}

/* ═══ シート ═══ */
.sheet{
  position:fixed;inset:0;background:rgba(20,25,29,.5);z-index:50;display:flex;align-items:flex-end;
  backdrop-filter:blur(2px);
}
.sheet[hidden]{display:none}
.sheet > .in{
  width:100%;max-height:88vh;background:var(--paper);border-radius:16px 16px 0 0;
  padding:14px 14px calc(var(--sab) + 14px);overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheet h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center}
.sheet h2 button{margin-left:auto;background:none;border:none;color:var(--go);font-size:15px;padding:0}

/* ═══ 書き出し ═══ */
.run{position:fixed;inset:0;background:#12161ae8;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:11px;color:#e8ecea;backdrop-filter:blur(4px);
  padding:calc(var(--sat) + 16px) 18px calc(var(--sab) + 18px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.run[hidden]{display:none}
.run .ttl{font-size:16px;font-weight:600}
.run .ring{position:relative;width:132px;height:132px;flex:0 0 auto;margin-top:4px}
.run .ring svg{transform:rotate(-90deg)}
.run .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;
  font-size:25px;font-weight:700;font-family:"SF Mono",ui-monospace,monospace}
.run .ring .pct .lb{font-size:12px;font-weight:600;font-family:inherit;color:#8fd6b1}
.run .st{font-size:13px;color:#a9b3b0;text-align:center}
.run .warn{font-size:11.5px;color:#e0a44e;text-align:center;max-width:290px;line-height:1.7}
#resbox{position:relative;width:100%;max-width:420px;flex:0 0 auto}
#resbox[hidden]{display:none}
.run video{width:100%;display:block;border-radius:8px;background:#000}
#resic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:66px;height:66px;border-radius:50%;background:rgba(12,16,19,.62);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;
  pointer-events:none;opacity:1;transition:opacity .3s}
#resic.hide{opacity:0;transition:opacity .45s .5s}
.run .acts{display:flex;gap:8px;width:100%;max-width:420px}
.run .acts[hidden]{display:none}
.run .acts button{padding:12px 4px;font-size:13px}
.run .acts button{flex:1;padding:13px;border-radius:9px;border:1px solid #3a444b;background:#232b31;color:#e8ecea;font-size:14px}
.run .acts button.p{background:var(--go);border-color:var(--go);color:#fff;font-weight:700}
.run .acts button.r{background:#b0442f;border-color:#b0442f;color:#fff;font-weight:700}
.run video{cursor:pointer}
#lg{width:100%;max-width:420px;flex:0 0 auto;max-height:124px;overflow-y:auto;background:#0d1114;border-radius:7px;
  padding:8px 10px;font-family:"SF Mono",ui-monospace,monospace;font-size:10.5px;line-height:18px;color:#8f9a96}
#lg:empty{display:none}
#lg .e{color:#e0776a} #lg .s{color:#6fce9e} #lg .w{color:#e0a44e}

/* 確認ダイアログ（iOSのホーム画面アプリでは confirm() が出ないことがあるため自前で持つ） */
#ask{position:fixed;inset:0;background:rgba(20,25,29,.55);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
#ask[hidden]{display:none}
#ask .in{width:100%;max-width:330px;background:var(--paper);border-radius:14px;
  padding:18px 16px 14px;box-shadow:0 14px 44px rgba(0,0,0,.38)}
#ask h3{margin:0 0 9px;font-size:15px}
#ask p{margin:0 0 16px;font-size:13px;line-height:1.75;color:var(--ink2);white-space:pre-wrap}
#ask .btns{display:flex;gap:8px}
#ask .btns button{flex:1;padding:12px 4px;border-radius:8px;border:1px solid var(--rule);
  background:#fff;color:var(--ink2);font-size:13.5px}
#ask .btns button.d{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:700}
.rstrow{margin-top:14px}

/* 録音の画面 */
.nb.rec{flex:1;background:#c0392b;border-color:#c0392b;color:#fff;font-weight:700}
.nb.rec:active{background:#98291c}
.rc{position:fixed;inset:0;background:#12161af5;z-index:65;display:flex;flex-direction:column;
  color:#e8ecea;padding:calc(var(--sat) + 8px) 12px calc(var(--sab) + 10px)}
.rc[hidden]{display:none}
.rchead{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.rchead .nm{font-size:15px;font-weight:700;color:#fff;background:var(--go);border-radius:7px;padding:5px 11px}
.rchead .sp{flex:1}
.rchead button{background:#232b31;border:1px solid #3a444b;color:#e8ecea;border-radius:8px;padding:7px 11px;font-size:13px}
.rchead button:disabled{opacity:.3}
.rccnt{font-size:11.5px;color:#9fb0a8;flex:0 0 auto;padding:6px 2px 0}
.rcmain{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin-top:4px}
.rcmain canvas{width:46%;max-width:220px;border-radius:6px;background:#000;flex:0 0 auto}
.rctx{font-size:clamp(17px,4.8vw,25px);line-height:1.85;font-weight:600;color:#f2f6f4;
  background:#0d1114;border:1px solid #2b343a;border-radius:9px;padding:12px 13px;white-space:pre-wrap}
.rctx.none{color:#8c979d;font-weight:400;font-size:14px;line-height:1.7}
.rcfoot{flex:0 0 auto;display:flex;flex-direction:column;gap:9px;align-items:center;padding-top:10px}
.rcst{font-size:13px;color:#a9b3b0;text-align:center;min-height:19px}
.rcst b{color:#ff7f6f}
.mic{flex:1;min-height:66px;padding:14px 8px;border-radius:11px;border:1px solid #c0392b;
  background:#c0392b;color:#fff;font-size:17px;font-weight:700}
.mic.on{background:#7d2018;border-color:#e0776a;animation:pls 1.1s infinite}
.microw{display:flex;gap:10px;width:100%;max-width:420px;align-items:stretch}
.microw[hidden]{display:none}
.mic:disabled{opacity:.32}
.sq{flex:0 0 66px;width:66px;height:66px;border-radius:11px;border:1px solid #3a444b;
  background:#232b31;color:#e8ecea;font-size:24px;line-height:1}
.sq:disabled{opacity:.28}
#rc-redo{border-color:#7a5a2a;color:#f0c078}
@keyframes pls{50%{opacity:.62}}
.vimp{width:100%;max-width:420px;padding:11px;border-radius:9px;border:1px solid #3a444b;
  background:#1b2228;color:#c9d3d8;font-size:13.5px}
.vimp[hidden]{display:none}
.vimp:disabled{opacity:.32}
.rcsub,.rcnav{display:flex;gap:8px;width:100%;max-width:420px}
.rcsub[hidden]{display:none}
.rcsub button,.rcnav button{padding:12px;border-radius:9px;border:1px solid #3a444b;
  background:#232b31;color:#e8ecea;font-size:14px}
.rcsub button{flex:1;font-size:13.5px}
.rcnav button:disabled{opacity:.3}
.rcnav button.go{flex:1;background:var(--go);border-color:var(--go);color:#fff;font-weight:700}
.rcnav button.mk{flex:1;background:#1f7a4d;border-color:#5fd0a0;color:#fff;font-weight:700}

/* ═══ パソコン（幅の広い画面）═══
   iPhoneの並びはそのままに、大きさと余白だけ整える。中央1列に収める。 */
@media (min-width:820px){
  body{align-items:center;background:#dde2db}
  /* 画面に流れて並ぶ部分だけ中央1列にする。
     ※ .sheet / .run / #rc / #ask / #zoom は position:fixed の重ね表示なので
       ここに含めない（含めると幅だけ縮んで左に寄り、ホーム画面とズレる） */
  header,.gauge,.pager,.stage,.body,footer{width:100%;max-width:920px;align-self:center}
  header{border-radius:0}
  .body{background:var(--paper)}
  .stage{padding:10px 12px 12px}
  .stage .tapzone,.stage > .paper{max-width:660px;margin:0 auto}
  .pg{width:60px}
  .pg .l{max-width:60px;font-size:10.5px}
  .nb{padding:13px 22px;font-size:16px}
  footer{padding:11px 14px}
  .card{padding:14px 16px}
  .g2{gap:12px}
  /* 設定ページ：ホーム画面と同じ幅・同じ中央位置で重ねる */
  .sheet{align-items:center;justify-content:center;padding:24px 0}
  .sheet > .in{width:100%;max-width:920px;max-height:86vh;border-radius:14px;
    padding:16px 18px 20px;box-shadow:0 20px 60px rgba(10,14,12,.45)}
  .sheet h2{position:sticky;top:-16px;z-index:3;background:var(--paper);
    margin:-16px -18px 12px;padding:16px 18px 10px;border-bottom:1px solid var(--rule2)}
  /* 録音の画面 */
  .rc{padding:22px 20px}
  .rchead,.rccnt,.rcmain,.rcfoot{width:100%;max-width:820px;margin-left:auto;margin-right:auto}
  .rcmain canvas{max-width:300px}
  .rctx{font-size:24px;line-height:1.9;padding:16px 18px}
  .microw,.rcnav,.vimp{max-width:560px}
  .vimp{font-size:15px;padding:13px}
  .mic{min-height:76px;font-size:19px}
  .sq{flex:0 0 76px;width:76px;height:76px;font-size:27px}
  .rcst{font-size:14px}
}
/* ═══ パソコンの広い画面：資料を左・入力欄を右の2列にする（v39） ═══
   iPhone（狭い画面）は今までどおり縦一列のまま。 */
@media (min-width:1024px){
  html{background:#dde2db}
  body{
    display:grid;background:var(--paper);
    width:min(1180px,98vw);margin:0 auto;height:100%;
    grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);
    grid-template-rows:auto auto auto auto minmax(0,1fr);
    grid-template-areas:"hd hd" "gg gg" "pg pg" "st bd" "ft bd";
  }
  header,.gauge,.pager,.stage,.body,footer{max-width:none;width:auto;align-self:stretch}
  header{grid-area:hd}
  .gauge{grid-area:gg}
  .pager{grid-area:pg}
  /* 左：資料の見本。上に寄せて置く */
  .stage{grid-area:st;align-self:start;padding:14px 16px 0;
    border-bottom:none;box-shadow:none}
  .stage .tapzone,.stage > .paper{max-width:none;margin:0}
  /* 右：入力欄。ここだけが縦に流れる。境目の線はここで引く */
  .body{grid-area:bd;min-height:0;overflow-y:auto;padding:12px 16px 16px;
    border-left:1px solid var(--rule2)}
  /* 「次へ ＋」は資料の見本の真下。資料から1cm下げ、幅は資料と同じ */
  footer{grid-area:ft;align-self:start;margin-top:1cm;padding:0 16px 16px;
    background:none;border-top:none}
}
/* マウスのある環境だけ、触れたときの反応を出す */
@media (hover:hover) and (pointer:fine){
  .nb:hover:not(:disabled){filter:brightness(.95)}
  .pg:hover .d{border-color:var(--go)}
  .chgbtn:hover{background:rgba(22,27,31,.92)}
  .tapzone:hover .hintbox{color:var(--go)}
  .mic:hover:not(:disabled),.sq:hover:not(:disabled){filter:brightness(1.15)}
  .rcnav button:hover:not(:disabled),.run .acts button:hover{filter:brightness(1.15)}
  .card button:hover:not(:disabled){filter:brightness(.97)}
}

/* 拡大 */
#zoom{position:fixed;inset:0;background:#0d1114f5;z-index:70;display:flex;align-items:center;justify-content:center;padding:8px}
#zoom[hidden]{display:none}
#zoom canvas{width:100%;max-height:100%;border-radius:6px}
</style>

<!-- 動画の置き場。iOS は画面に入っていない video の絵を作ってくれないことがあるので、
     ごく小さく置いておく。display:none も opacity:0 も「描かなくてよい」と判断されて
     取り込みが真っ黒になるため不可。z-index も負にしない（v45）。 -->
<div id="vpool" style="position:fixed;left:0;bottom:0;width:2px;height:2px;
  overflow:hidden;opacity:.02;pointer-events:none;z-index:1"></div>

<script>
"use strict";

/* ══════════ 1. モデル ══════════ */

const KINDS={
  title:{n:"タイトル",fixed:true},
  toc:{n:"目次",fixed:true},
  content:{n:"ページ",fixed:false},
  cost:{n:"効果（金額）",fixed:true},
  closing:{n:"結び",fixed:true},
};
const FREE="自由記載";
/* ページの種類は同じ「content」だが、効果より前＝本編（main）、効果より後＝まとめ（summary）。
   目次・ページ番号・下のボタンの動きを、このゾーンで分けている。
   ※ここは let P=blank() より前に置くこと（後ろだと読み込み時に落ちる） */
const SUM="summary";
function zoneOf(p){ return p&&p.zone===SUM?SUM:"main"; }
function isSum(p){ return !!p&&p.kind==="content"&&zoneOf(p)===SUM; }
function hasSum(){ return P.pages.some(isSum); }
const LABELS=[FREE,"改善前","問題点","改善点","改善後","効果","（見出しなし）"];
const MODES=[{v:"both",t:"字幕＋読み上げ"},{v:"say",t:"読み上げのみ"},{v:"mute",t:"無音"}];
// スライドの型（「この画面の扱い」＝MODES とは別の軸）
const LAYOUTS=[{v:"text",t:"テキストのみ"},{v:"photo",t:"写真＋下部テキスト"},
  {v:"side",t:"写真左＋文字右"},{v:"photoonly",t:"写真のみ"}];
const layoutOf=p=>p.layout||"photo";
const hasPhoto=p=>layoutOf(p)!=="text";

const DEFAULTS={
  ttsKey:"", ttsVoice:"ja-JP-Chirp3-HD-Orus", ttsRate:1.0, ttsPitch:0,
  // 性別を切り替えても、その性別で最後に選んだ声に戻る
  voiceMemo:{f:"ja-JP-Chirp3-HD-Aoede",m:"ja-JP-Chirp3-HD-Orus"},
  accent:"#1f7a4d", mailTo:"", mailApp:"gmail",
  width:1280, height:720, fps:30, targetMB:24, maxSec:210,
  subSize:44, subColor:"#ffffff", subStyle:"outline", subBottom:7, subMaxLines:2,
  theme:"light", silentSec:2.5, pad:0.3,
  chargeMachine:"", chargeMan:"", months:12,
  closingText:"ご清聴ありがとうございました", orgName:"",
  presenterName:"", deptName:"",
  readFixes:[
    {f:"様に",t:"ように",on:true},
    {f:"様な",t:"ような",on:true},
    {f:"様々",t:"さまざま",on:true},
    {f:"行った",t:"おこなった",on:true},
    {f:"一日",t:"いちにち",on:true},
    {f:"一人",t:"ひとり",on:true},
    {f:"二人",t:"ふたり",on:true},
    {f:"治具",t:"じぐ",on:true},
    {f:"芯出し",t:"しんだし",on:true},
    {f:"工数",t:"こうすう",on:true},
  ],
};
const THEMES={
  light:{bg:"#fbfbf8",fg:"#15191d",sub:"#5b646b",line:"#d5d8d1"},
  dark: {bg:"#12161b",fg:"#eef2f5",sub:"#9aa7b3",line:"#2d3742"},
};
const theme=()=>({...THEMES[S.theme],ac:S.accent||"#1f7a4d"});
// [名前, 表示名, 性別 f/m, 音質ランク]
const TIERS={hd:"Chirp3 HD ／ 最高音質",n2:"Neural2 ／ 標準・速度調整可",wn:"WaveNet",st:"Standard ／ 最安"};
const VOICES=[
  ["ja-JP-Chirp3-HD-Aoede","アオエデ　落ち着いた","f","hd"],
  ["ja-JP-Chirp3-HD-Kore","コーレ　明るい","f","hd"],
  ["ja-JP-Chirp3-HD-Leda","レダ　やわらかい","f","hd"],
  ["ja-JP-Chirp3-HD-Zephyr","ゼフィア　軽やか","f","hd"],
  ["ja-JP-Chirp3-HD-Charon","カロン　低め・落ち着き","m","hd"],
  ["ja-JP-Chirp3-HD-Puck","パック　明るい","m","hd"],
  ["ja-JP-Chirp3-HD-Orus","オルス　標準的","m","hd"],
  ["ja-JP-Chirp3-HD-Fenrir","フェンリル　力強い","m","hd"],
  ["ja-JP-Neural2-B","Neural2 B","f","n2"],
  ["ja-JP-Neural2-C","Neural2 C","m","n2"],
  ["ja-JP-Neural2-D","Neural2 D","m","n2"],
  ["ja-JP-Wavenet-A","WaveNet A","f","wn"],
  ["ja-JP-Wavenet-C","WaveNet C","m","wn"],
  ["ja-JP-Standard-A","Standard A","f","st"],
  ["ja-JP-Standard-C","Standard C","m","st"],
];
const isChirp=n=>/Chirp/i.test(n||"");
const vRec=n=>VOICES.find(v=>v[0]===n)||VOICES[0];
const genderOf=n=>vRec(n)[2];

function uid(){return Math.random().toString(36).slice(2,10);}
let S={...DEFAULTS};
let P=blank();
let cur=0;
let mk=false;        // true のあいだは最後の「動画作成」ページを表示（v24）
let exporting=false;
let running=false;        // 書き出しの最中（このあいだは画面を離れない）      // 書き出し中は動画のプレビュー用静止画を使わない
const media=new Map();   // id -> {blob,url,el,kind,dur}
const audio=new Map();   // pageId -> {buf,dur}
const rec=new Map();     // pageId -> {blob,buf,dur}  自分の声（録音）
const shrunkCache=new Map(); // 素材ID:範囲 -> 詰め直した動画（内容の保存を2回目から速くする）v48
let useRec=false;        // true のあいだは音声を「録音した声」から取る
let silentMode=false;    // true のあいだは音声を作らず、読み上げのぶんだけ間をとる

// 効果の初期値。数値は空欄（0を入れない）
function blankCost(){
  return {qty:"",qtyUnit:"month",base:"",
    mBefore:"",mAfter:"",hBefore:"",hAfter:"",target:"both"};
}
const num=v=>{const n=Number(v);return isFinite(n)?n:0;};
function blank(){
  return {
    meta:{title:"",dept:"",presenter:"",members:"",speaker:""},
    cost:blankCost(),
    pages:[
      {id:uid(),kind:"title"},
      {id:uid(),kind:"toc",show:"",say:"",mode:"say"},
      /* 内容ページは最初から入れない（＋で足していく形にした） */
      {id:uid(),kind:"cost",say:""},
      {id:uid(),kind:"closing",say:""},
    ],
  };
}
function newContent(label,from,zone){
  return {id:uid(),kind:"content",zone:zone===SUM?SUM:"main",label:label||FREE,
    labelText:from?.labelText||"",layout:from?.layout||"photo",mediaId:null,
    show:"",say:"",mode:"both",trimStart:0,trimEnd:0,pause:null};
}
// 読み上げの後ろに入れる空白時間（秒）
const pauseOf=p=>p.pause!=null?Number(p.pause)
  :(speechOf(p)?Number(S.pad):Number(S.silentSec));
const $=q=>document.querySelector(q);
// マウス操作の環境（Windowsなど）では「タップ」ではなく「クリック」と出す
const isPC=(()=>{try{return matchMedia("(hover:hover) and (pointer:fine)").matches;}catch{return false;}})();
const TAP=isPC?"クリック":"タップ";
const esc=s=>(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(Math.round(s)%60)).padStart(2,"0");
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const pages=()=>P.pages;
const page=()=>P.pages[cur];
const firstFixed=k=>P.pages.findIndex(p=>p.kind===k);

/* 確認ダイアログ。iOSのホーム画面アプリでは confirm() が反応しないことがあり、
   「削除」が効かない原因になっていたので、画面の中に自前で出す。 */
function ask(title,msg,okLabel,noLabel){
  return new Promise(res=>{
    $("#ask-t").textContent=title;
    $("#ask-m").textContent=msg;
    $("#ask-y").textContent=okLabel||"削除する";
    $("#ask-n").textContent=noLabel||"やめる";   // 左＝取り消し側。同じ文字が並ばないように
    $("#ask").hidden=false;
    const fin=v=>{ $("#ask").hidden=true; $("#ask-y").onclick=null; $("#ask-n").onclick=null; res(v); };
    $("#ask-y").onclick=()=>fin(true);
    $("#ask-n").onclick=()=>fin(false);
  });
}

/* 知らせるだけのダイアログ（ボタンは1つ） */
function tell(title,msg){
  return new Promise(res=>{
    $("#ask-t").textContent=title;
    $("#ask-m").textContent=msg;
    $("#ask-y").textContent="閉じる";
    $("#ask-n").hidden=true;
    $("#ask").hidden=false;
    $("#ask-y").onclick=()=>{ $("#ask").hidden=true; $("#ask-n").hidden=false; $("#ask-y").onclick=null; res(); };
  });
}

/* ══════════ 2. 保存 ══════════ */
let db;
const openDB=()=>new Promise((r,j)=>{const q=indexedDB.open("teian-ios",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("m");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>j(q.error)});
const idb=(m,f)=>new Promise((r,j)=>{const q=f(db.transaction("m",m).objectStore("m"));
  q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const putB=(k,b)=>idb("readwrite",s=>s.put(b,k));
/* iPhoneは「元のファイルの場所を指すだけ」の入れ物をそのまま保存してしまうことがあり、
   アプリを閉じて元ファイルが消えると中身も読めなくなる。
   いったんバイト列に起こしてから保存すると、確実にこの端末の中へ写しが残る（v42） */
const solid=async(b,type)=>new Blob([await b.arrayBuffer()],{type:type||(b&&b.type)||""});
async function putSolid(k,b,type){
  const s2=await solid(b,type);
  await putB(k,s2);
  return s2;
}
const getB=k=>idb("readonly",s=>s.get(k));
const delB=k=>idb("readwrite",s=>s.delete(k));
let sv;
const save=()=>{clearTimeout(sv);sv=setTimeout(()=>{
  try{localStorage.setItem("ti.p",JSON.stringify(P));localStorage.setItem("ti.s",JSON.stringify(S));}catch{}},250);};
function load(){
  try{const s=JSON.parse(localStorage.getItem("ti.s"));if(s)S={...DEFAULTS,...s};}catch{}
  try{const p=JSON.parse(localStorage.getItem("ti.p"));if(p?.pages?.length)P=p;}catch{}
  migrate();
}
function migrate(){
  if(!Array.isArray(S.readFixes)) S.readFixes=DEFAULTS.readFixes.map(r=>({...r}));
  if(!S.voiceMemo||typeof S.voiceMemo!=="object") S.voiceMemo={...DEFAULTS.voiceMemo};
  S.voiceMemo={...DEFAULTS.voiceMemo,...S.voiceMemo,[genderOf(S.ttsVoice)]:S.ttsVoice};
  const c={...blankCost(),...(P.cost||{})};
  if("before" in c || "basis" in c){          // 旧：機械／人が一体だった頃の値を引き継ぐ
    if(c.mBefore===""&&c.hBefore===""){
      if(c.target==="man"){ c.hBefore=c.before??""; c.hAfter=c.after??""; }
      else { c.mBefore=c.before??""; c.mAfter=c.after??""; }
    }
    if(c.base===""&&c.basis==="per") c.base=1;
    delete c.before; delete c.after; delete c.basis;
  }
  if(c.qty===0) c.qty="";                     // 0 は空欄あつかいに
  P.cost=c;
  for(const p of P.pages) if(p.kind==="content"){ if(!p.layout) p.layout="photo"; if(!p.zone) p.zone="main"; }
  // 以前に手で入れてある部署・代表者は、設定の値で上書きしない
  if(P.meta.deptLocked==null)      P.meta.deptLocked      = !!(P.meta.dept||"").trim()      && P.meta.dept!==S.deptName;
  if(P.meta.presenterLocked==null) P.meta.presenterLocked = !!(P.meta.presenter||"").trim() && P.meta.presenter!==S.presenterName;
  if(P.meta.speaker==null) P.meta.speaker="";
}

/* ══════════ 3. 素材 ══════════ */
/* 写真・動画を選ぶ
   ・パソコン（Chrome/Edge）… showOpenFilePicker。前に選んだファイルの場所から開く
   ・iPhone …             これまでどおり <input type=file>（写真アプリが開く） */
let lastPickH=null;                       // 前回選んだファイルの手がかり
const canFS=()=>typeof window.showOpenFilePicker==="function";
async function pick(pg,multi){
  if(canFS()){ return pickPC(pg,multi); }
  const inp=multi?$("#fpm"):$("#fp");
  inp.dataset.pid=pg.id;
  inp.click();
}
async function pickPC(pg,multi){
  const opt={
    multiple:!!multi,
    id:"teian-media",                     // 同じidなら前回のフォルダを覚えてくれる
    types:[{description:"写真・動画",accept:{
      "image/*":[".png",".jpg",".jpeg",".gif",".webp",".bmp",".heic"],
      "video/*":[".mp4",".mov",".m4v",".webm"]}}],
  };
  if(lastPickH) opt.startIn=lastPickH;    // 前回のファイルと同じ場所を開く
  let hs;
  try{ hs=await window.showOpenFilePicker(opt); }
  catch(e){
    if(e&&e.name==="AbortError") return;  // キャンセル
    try{ delete opt.startIn; hs=await window.showOpenFilePicker(opt); }catch{ return; }
  }
  if(!hs||!hs.length) return;
  lastPickH=hs[hs.length-1];
  try{ await putB("lastPick",lastPickH); }catch{}   // 次に開いたときも同じ場所から
  let anchor=pg;
  if(multi){
    for(const h of hs){ const f=await h.getFile(); const np=await attachFile(pg,f,anchor); if(np) anchor=np; }
    cur=P.pages.indexOf(anchor);
  }else{
    await attachFile(pg,await hs[0].getFile());
  }
  save(); paint();
}
async function attachFile(pg,f,insertAfter){
  const isV=f.type.startsWith("video/");
  if(!isV&&!f.type.startsWith("image/")) return;
  const id=uid();
  const b=await putSolid(id,f,f.type);
  await link(id,b,isV?"video":"image");
  if(insertAfter){
    const np=newContent(pg.label,pg,zoneOf(pg));
    np.mediaId=id;
    const m=media.get(id); if(m&&m.kind==="video") np.trimEnd=Math.min(15,m.dur);
    P.pages.splice(P.pages.indexOf(insertAfter)+1,0,np);
    return np;
  }
  if(pg.mediaId){ dropMedia(pg.mediaId); delB(pg.mediaId); }
  pg.mediaId=id;
  const m=media.get(id);
  if(m&&m.kind==="video"){pg.trimStart=0;pg.trimEnd=Math.min(15,m.dur);}
  return pg;
}
/* その絵が真っ黒（＝まだ中身が来ていない）かどうかを見る。
   iOS は用意ができていない動画を drawImage しても黒いままになる（v45） */
const _chk=document.createElement("canvas"); _chk.width=_chk.height=12;
function looksBlank(el){
  try{
    const g=_chk.getContext("2d",{willReadFrequently:true});
    g.clearRect(0,0,12,12); g.drawImage(el,0,0,12,12);
    const d=g.getImageData(0,0,12,12).data;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]!==0&&(d[i]>10||d[i+1]>10||d[i+2]>10)) return false;
    }
    return true;
  }catch{ return false; }
}
/* 動画のプレビュー用に、1コマだけ静止画（poster）を焼いておく。
   iOS では再生前の video を drawImage しても何も描かれないため。
   書き出しで使う m.el には一切触れないよう、別の video 要素で撮る。 */
function grabPoster(url,dur){
  return new Promise(res=>{
    const v=document.createElement("video");
    v.src=url; v.muted=true; v.playsInline=true; v.preload="auto";
    v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
    let over=false;
    const fin=cv=>{ if(over)return; over=true; clearTimeout(tm);
      try{ v.removeAttribute("src"); v.load(); }catch{}
      res(cv||null); };
    const tm=setTimeout(()=>fin(null),4000);
    const shoot=()=>{
      try{
        const w=v.videoWidth,h=v.videoHeight;
        if(!w||!h) return fin(null);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        const g=cv.getContext("2d");
        g.drawImage(v,0,0,w,h);
        fin(looksBlank(v)?null:cv);          // 真っさら・真っ黒なら失敗扱い
      }catch{ fin(null); }
    };
    v.onloadeddata=()=>{
      const t=Math.min(0.15,(dur||0)*0.25); // 先頭が黒いことがあるので少し進めて撮る
      if(t>0.02){ v.onseeked=shoot; try{ v.currentTime=t; }catch{ shoot(); } }
      else shoot();
    };
    v.onerror=()=>fin(null);
  });
}
/* 使わなくなった素材の後始末（動画は置き場からも外す） */
function dropMedia(id){
  const m=media.get(id); if(!m) return;
  try{ if(m.kind==="video"&&m.el){ m.el.pause(); m.el.removeAttribute("src"); m.el.load(); m.el.remove(); } }catch{}
  try{ URL.revokeObjectURL(m.url); }catch{}
  media.delete(id);
  // 詰め直した動画の控えも捨てる（素材が変わったのに古いものを入れないように）v48
  try{ for(const k of [...shrunkCache.keys()]) if(k.startsWith(id+":")) shrunkCache.delete(k); }catch{}
}
/* .mov（video/quicktime）は Windows の Chrome / Edge が種類だけで弾いてしまう。
   中身はMP4と同じ形式なので、video/mp4 として渡し直すと再生できることが多い。
   それでもダメなときは元の種類でもう一度試す。 */
const asMp4=b=>(b&&b.type==="video/quicktime")?new Blob([b],{type:"video/mp4"}):b;
const badMedia=new Map();          // 読み込めなかった素材（作成時にログで知らせる）
const link=(id,blob,kind)=>new Promise(res=>{
  if(kind==="video"){
    const tries=[]; const alt=asMp4(blob);
    if(alt!==blob) tries.push(alt);
    tries.push(blob);
    const go=k=>{
      if(k>=tries.length){ badMedia.set(id,blob.type||"不明"); return res(); }
      const b=tries[k], url=URL.createObjectURL(b);
      const v=document.createElement("video");
      v.src=url;v.muted=true;v.playsInline=true;v.preload="auto";v.setAttribute("playsinline","");
      v.setAttribute("webkit-playsinline","");v.setAttribute("muted","");
      v.controls=false; v.style.cssText="width:1px;height:1px";
      try{ document.getElementById("vpool").appendChild(v); }catch{}
      v.onloadedmetadata=()=>{
        badMedia.delete(id);
        const m={blob,url,el:v,kind:"video",dur:v.duration||0,poster:null};
        media.set(id,m); res();
        grabPoster(url,m.dur).then(cv=>{ m.poster=cv; try{ live(); }catch{} });
      };
      v.onerror=()=>{
        try{ URL.revokeObjectURL(url); }catch{}
        try{ v.removeAttribute("src"); v.load(); v.remove(); }catch{}
        go(k+1);
      };
    };
    go(0);
  }else{
    const url=URL.createObjectURL(blob);
    const i=new Image();i.src=url;
    i.onload=()=>{ badMedia.delete(id); media.set(id,{blob,url,el:i,kind:"image",dur:0});res();};
    i.onerror=()=>{ badMedia.set(id,blob.type||"不明"); res(); };
  }});
/* 端末の保存領域から写真が出てこなかったページ。
   ここで mediaId を消してしまうと保存が上書きされて永久に失われるので、
   紐付けは残したまま「見つからない」印だけを付ける（v41） */
const lostMedia=new Set();
const isLost=p=>!!p.mediaId&&!media.has(p.mediaId);
async function restore(){
  lostMedia.clear();
  for(const p of P.pages) if(p.mediaId){
    let b=null;
    try{ b=await getB(p.mediaId); }catch{}
    if(b) await link(p.mediaId,b,b.type.startsWith("video/")?"video":"image");
    else lostMedia.add(p.mediaId);
  }
  // パソコンで前に選んだファイルの場所（次回のダイアログの開き先）
  try{ const h=await getB("lastPick"); if(h&&typeof h.getFile==="function") lastPickH=h; }catch{}
  try{ const h=await getB("lastVoice"); if(h&&typeof h.getFile==="function") lastVoiceH=h; }catch{}
  // 録音した声（動画が完成するまで残しておく）。音の中身はあとから読み込む
  for(const p of P.pages) if(p.rec){
    const b=await getB("rec:"+p.id);
    if(b) rec.set(p.id,{blob:b,buf:null,dur:Number(p.recDur)||0});
    else { p.rec=false; p.recDur=0; }
  }
}

/* ══════════ 4. 原価 ══════════ */
const TGT={machine:"機械",man:"人",both:"機械＋人"};
const UNITS=[{v:"unit",t:"この個数ぶん"},{v:"month",t:"1ヶ月あたり"},{v:"year",t:"1年あたり"}];
// 期間の呼び名。月間×稼働6ヶ月のときだけ「半年」
function periodOf(){
  const c=P.cost, mo=Number(S.months)||12;
  if(c.qtyUnit==="month") return {mul:mo,name:mo===6?"半年":"年間",unitName:mo===6?"半年で":"年間",months:mo};
  if(c.qtyUnit==="year")  return {mul:1,name:"年間",unitName:"年間",months:12};
  return {mul:1,name:"合計",unitName:"合計",months:0};   // 個数ぶん＝単発
}
function calc(){
  const c=P.cost, q=num(c.qty), base=num(c.base)||1, pr=periodOf();
  const scale=q/base*pr.mul;                       // 基準個数あたりの時間を数量・期間に按分
  const mDiff=num(c.mBefore)-num(c.mAfter);        // 機械の短縮（分／基準個数）
  const hDiff=num(c.hBefore)-num(c.hAfter);        // 人の短縮（分／基準個数）
  const useM=c.target!=="man", useH=c.target!=="machine";
  const mMin=useM?mDiff*scale:0, hMin=useH?hDiff*scale:0;
  const mH=mMin/60, hH=hMin/60;
  const rateM=Number(S.chargeMachine)||0, rateH=Number(S.chargeMan)||0;
  const mAmt=mH*rateM, hAmt=hH*rateH;
  return {q,base,scale,mDiff,hDiff,useM,useH,mMin,hMin,mH,hH,rateM,rateH,
    mAmt,hAmt,amount:mAmt+hAmt,savedH:mH+hH,period:pr,target:c.target,qtyUnit:c.qtyUnit};
}
const n1=n=>(Math.round(n*10)/10).toLocaleString("ja-JP");
// 「10個当たり」の按分と期間を1行で表す
function scaleLine(k){
  const q=k.q.toLocaleString("ja-JP"), b=k.base.toLocaleString("ja-JP");
  const per=k.qtyUnit==="month"?`${q}個/月`:k.qtyUnit==="year"?`${q}個/年`:`${q}個`;
  return k.period.mul>1?`数量 ${per} ÷ ${b}個あたり × ${k.period.months}ヶ月`
                       :`数量 ${per} ÷ ${b}個あたり`;
}
function costLines(){
  const k=calc(),L=[],P_=k.period;
  L.push(scaleLine(k));
  if(k.useM&&k.mDiff) L.push(`機械 ${n1(num(P.cost.mBefore))}分 − ${n1(num(P.cost.mAfter))}分 → ${P_.name} ${n1(k.mH)}時間 × ${yen(k.rateM)}／時 ＝ ${yen(k.mAmt)}`);
  if(k.useH&&k.hDiff) L.push(`人　 ${n1(num(P.cost.hBefore))}分 − ${n1(num(P.cost.hAfter))}分 → ${P_.name} ${n1(k.hH)}時間 × ${yen(k.rateH)}／時 ＝ ${yen(k.hAmt)}`);
  if(k.useM&&k.useH&&k.mDiff&&k.hDiff) L.push(`機械＋人 合算 ＝ ${P_.name} ${n1(k.savedH)}時間`);
  if(L.length===1) L.push("削減時間を入力してください");
  return L;
}
function costSay(){
  const k=calc(); if(!k.savedH) return "";
  const p=k.period.name;
  let s="原価低減の効果です。";
  if(k.useM&&k.mDiff) s+=`機械は ${n1(num(P.cost.mBefore))}分 から ${n1(num(P.cost.mAfter))}分 に、`;
  if(k.useH&&k.hDiff) s+=`人の作業は ${n1(num(P.cost.hBefore))}分 から ${n1(num(P.cost.hAfter))}分 に短縮しました。`;
  else if(k.useM&&k.mDiff) s+="短縮しました。";
  s+=`${p}で およそ ${Math.round(k.savedH)} 時間の削減となり、`;
  s+=`チャージで換算すると ${p} ${Math.round(k.amount)} 円の低減効果です。`;
  return s;
}

/* ══════════ 5. タイムライン ══════════ */
function speechOf(p){
  if(p.kind==="title")   return (p.say||"").trim();
  if(p.kind==="toc")     return (p.say||"").trim()||tocSpeech();
  if(p.kind==="cost")    return (p.say||"").trim()||costSay();
  if(p.kind==="closing") return (p.say||"").trim()||S.closingText;
  if(p.mode==="mute")    return "";
  return (p.say||"").trim()||(p.show||"").trim();
}
// 字幕は「写真＋下部テキスト」のときだけ。テキストのみは中央に本文として描く
const subOf=p=>(p.kind==="content"&&p.mode==="both"&&layoutOf(p)==="photo")?(p.show||"").trim():"";
// 見出しの実際の文言（自由記載はユーザーの入力文）
function dispLabel(p){
  if(p.kind!=="content") return "";
  return p.label===FREE?(p.labelText||"").trim():p.label;
}
// 見出し欄に出す文字（自由記載なら入力文、それ以外は選んだ見出しそのもの）
const labField=p=>p.label===FREE?(p.labelText||""):p.label;
// 目次に並ぶ見出し（重複は1つに、空と「（見出しなし）」は除く）。最後は必ず「効果」
function tocItems(){
  const ls=[...new Set(P.pages.filter(p=>p.kind==="content"&&!isSum(p))
    .map(dispLabel).filter(l=>l&&l!=="（見出しなし）"))].filter(l=>l!=="効果"&&l!=="まとめ");
  ls.push("効果");
  if(hasSum()) ls.push("まとめ");          // まとめのページが1枚でもあるときだけ
  return ls;
}
const ORD=["一つ目","二つ目","三つ目","四つ目","五つ目","六つ目","七つ目","八つ目","九つ目"];
const ordOf=i=>ORD[i]||`${kanNum(String(i+1))}番目`;
// 「〜とは」「〜について」で終わる見出しには「について」を足さない
const aboutOf=l=>/(とは|について|の話|か)$/.test(l)?"":"について";
function tocSpeech(){
  const ls=tocItems();
  const sum=ls[ls.length-1]==="まとめ";      // まとめだけは「〜つ目」と数えずに読む
  const main=sum?ls.slice(0,-1):ls;
  return "以上の内容で発表します。"
    + main.map((l,i)=>`${ordOf(i)}、${l}${aboutOf(l)}。`).join("")
    + (sum?"最後に、まとめです。":"")
    + "順番に説明していきます。";
}
/* ② 代表者・部署から冒頭あいさつを自動で作る */
function titleSay(){
  const dept=(P.meta.dept||"").trim(), who=(P.meta.presenter||"").trim();
  const sp=(P.meta.speaker||"").trim();
  const list=(P.meta.members||"").split(/[、,，\s]+/).map(s=>s.trim()).filter(Boolean);
  if(!dept&&!who&&!sp&&!list.length) return "";
  const out=[];
  if(dept&&who)      out.push(`${dept}の${who}です。`);
  else if(who)       out.push(`${who}です。`);
  else if(dept)      out.push(`${dept}です。`);
  // 代表者＋メンバー（何人でも読点でつなぐ）
  const all=[...new Set([who,...list].filter(Boolean))];
  if(list.length)    out.push(`メンバーは、${all.join("、")}です。`);   // メンバー欄が空ならこの一文は入れない
  if(sp)             out.push(`発表は${sp}が行います。`);
  out.push("宜しくお願いします。");
  return out.join("");
}
// 設定の代表者・部署をタイトルへ流し込み、あいさつを作り直す（手で直した文は残す）
function syncTitle(){
  const t=P.pages.find(p=>p.kind==="title"); if(!t) return;
  // 手で入れていなければ、設定の値をそのまま反映し続ける（入力中の1文字で止めない）
  if(!P.meta.deptLocked      && S.deptName)      P.meta.dept=S.deptName;
  if(!P.meta.presenterLocked && S.presenterName) P.meta.presenter=S.presenterName;
  if(!t.sayLocked){
    const a=titleSay();
    if(t.say!==a){ audio.delete(keyOf(t)); t.say=a; }
  }
}
const estimate=t=>t?Math.max(1.2,t.replace(/\s/g,"").length*0.16/(Number(S.ttsRate)||1)+0.5):Number(S.silentSec);
const fixSig=()=>(S.readFixes||[]).filter(r=>r.on).map(r=>r.f+">"+r.t).join(",");
const keyOf=p=>p.id+"#"+hash(speechOf(p)+"|"+S.ttsVoice+"|"+S.ttsRate+"|"+fixSig());
const hash=s=>{let h=0;for(let i=0;i<(s||"").length;i++)h=(h*31+s.charCodeAt(i))|0;return(h>>>0).toString(36)};

function timeline(){
  let t=0;
  return P.pages.map(p=>{
    const txt=speechOf(p);
    const a=voiceOf(p);
    const sp=a?a.dur:(txt?estimate(txt):0);
    let dur=sp+pauseOf(p);
    const m=p.mediaId?media.get(p.mediaId):null;
    if(m&&m.kind==="video"){
      const clip=Math.max(0.5,(p.trimEnd||m.dur)-(p.trimStart||0));
      dur=Math.max(dur,clip);
    }
    const o={p,txt,sub:subOf(p),dur,start:t,guess:!a,speech:sp,media:m};
    t+=dur; return o;
  });
}
const totalDur=()=>timeline().reduce((a,c)=>a+c.dur,0);

function estSize(tl){
  // 静止画は 0.35Mbps、動画クリップは 2.2Mbps で概算
  let bits=0;
  for(const c of tl) bits += c.dur*((c.media&&c.media.kind==="video")?2.2e6:0.35e6);
  bits += totalDur()*64000;
  return bits/8/1048576;
}

function drawGauge(){
  const tl=timeline(), T=tl.reduce((a,c)=>a+c.dur,0), M=Number(S.maxSec);
  const sc=Math.max(T,M*1.02), g=$("#gbar");
  g.innerHTML="";
  for(const c of tl){
    const d=document.createElement("div"); d.className="sg";
    d.dataset.k=!c.txt?"mute":(c.media&&c.media.kind==="video")?"movie":c.media?"photo":"slide";
    d.style.flex="0 0 "+(c.dur/sc*100)+"%";
    g.appendChild(d);
  }
  const r=document.createElement("div");r.className="rest";g.appendChild(r);
  const l=document.createElement("div");l.className="lim";l.style.left=(M/sc*100)+"%";g.appendChild(l);
  const e=$("#g-t"); e.textContent=fmt(T); e.classList.toggle("over",T>M);
  $("#g-max").textContent=`/ ${fmt(M)}（目安）`;
  const mb=estSize(tl);
  $("#g-size").innerHTML=`約 ${mb.toFixed(0)} MB`+(mb>24?` <span style="color:var(--warn)">Gmail超過</span>`:"");
}

/* ══════════ 6. ページ送り ══════════ */
function drawPager(){
  const el=$("#pager");
  el.innerHTML=P.pages.map((p,i)=>{
    const st=i===cur?"cur":done(p)?"done":"";
    const n=p.kind==="content"
      ?(dispLabel(p)&&dispLabel(p)!=="（見出しなし）"?dispLabel(p):(isSum(p)?"まとめ":"ページ"))
      :KINDS[p.kind].n;
    const num=p.kind==="content"?(isSum(p)?"ま":contentNo(p)):{title:"表",toc:"目",cost:"効",closing:"結"}[p.kind];
    return `<button class="pg" data-i="${i}" data-s="${st}">
      <span class="d">${st==="done"?"済":num}</span><span class="l">${esc(n)}</span></button>`;
  }).join("")
  +`<button class="pg" data-i="make" data-s="${mk?"cur":""}">
      <span class="d">作</span><span class="l">動画作成</span></button>`;
  el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    if(b.dataset.i==="make") openMake(); else { mk=false; go(Number(b.dataset.i)); }});
  const c=el.querySelector('[data-s="cur"]');
  if(c) c.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
function labelNo(p){
  const me=dispLabel(p);
  if(!me) return 0;
  const same=P.pages.filter(x=>x.kind==="content"&&zoneOf(x)===zoneOf(p)&&dispLabel(x)===me);
  return same.length>1?same.indexOf(p)+1:0;
}
function headText(p){
  const n=labelNo(p), l=dispLabel(p);
  return l?(n?n+" "+l:l):"";
}
const contentNo=p=>{const n=labelNo(p);
  return n?String(n):String(P.pages.filter(x=>x.kind==="content"&&zoneOf(x)===zoneOf(p)).indexOf(p)+1);};
function done(p){
  if(p.kind==="title")   return !!P.meta.title;
  if(p.kind==="content") return layoutOf(p)==="text"?!!(p.show||"").trim():(!!p.mediaId&&!isLost(p));
  if(p.kind==="cost")    return calc().savedH!==0;
  return true;
}
/* ページを増やす（v11 からは下の「次へ」ボタンがこれ）
   ・内容ページを見ているとき  → そのページの「直後」に新しいページを入れる
   ・中身はすべて空。見出しも引き継がない（自由記載の空欄から始める）
   ・固定ページ（タイトル・目次・効果・結び）を見ているときは内容ゾーンの端に入れる */
function addPage(){
  const p=page();
  let at,np;
  if(p&&p.kind==="content"){
    at=cur+1;
    np=newContent(FREE,null,zoneOf(p));   // 見出しも引き継がず、同じゾーンにまっさらな1枚
  }else if(p&&p.kind==="toc"){
    at=cur+1;                             // 目次の直後に1枚（v24）
    np=newContent(FREE);
  }else if(p&&p.kind==="cost"){
    at=cur+1;                             // 効果の直後に「まとめ」を1枚
    np=newContent(FREE,null,SUM);
    if(!hasSum()) np.labelText="まとめ";   // 最初の1枚だけ見出しを入れておく（消せます）
  }else{
    const mains=P.pages.filter(x=>x.kind==="content"&&!isSum(x));
    const first=mains.length?P.pages.indexOf(mains[0]):-1;
    const last =mains.length?P.pages.indexOf(mains[mains.length-1]):-1;
    at=(p&&(p.kind==="title"||p.kind==="toc"))
        ? (first>=0?first:firstFixed("cost"))          // 前寄り＝内容ページの先頭へ
        : (last >=0?last+1:firstFixed("cost"));        // 後ろ寄り＝効果の直前へ
    np=newContent(FREE);
  }
  P.pages.splice(at,0,np);
  cur=at; save(); paint();            // 写真の選択は資料画面をタップしたときだけ
}
/* ══════════ 6b. 動画作成ページ（v24） ══════════
   結びの次に置く、動画の中身には入らない専用ページ。
   ここに「動画を作る」「録音する」と、内容ファイルの保存・読込をまとめた。 */
const recAll=()=>{ const need=P.pages.filter(x=>speechOf(x)).length;
  return need>0&&P.pages.filter(x=>speechOf(x)&&rec.has(x.id)).length>=need; };
/* できた動画がある間は、戻ってきたときも確認の画面をそのまま出す */
function openMake(){
  mk=true; paint(); const b=$(".body"); if(b) b.scrollTop=0;
  if(outFile){ $("#run").hidden=false; $("#run-x").hidden=false; $("#run-k").hidden=false; }
  else showRunReady();
}
function closeMake(){ mk=false; cur=P.pages.length-1; hideRun(); paint(); }
/* 動画作成の画面（待機）。ここに「録音する」と「動画を作る」を出す */
function showRunReady(){
  const tl=timeline(), T=tl.reduce((a,c)=>a+c.dur,0);
  const need=P.pages.filter(x=>speechOf(x)).length;
  const got =P.pages.filter(x=>speechOf(x)&&rec.has(x.id)).length;
  const all=recAll();
  $("#run").hidden=false;
  $("#run-t").textContent="動画作成";
  $("#ring").hidden=true;
  $("#run-w").hidden=true;
  $("#resbox").hidden=true; $("#lg").innerHTML="";
  $("#run-s").innerHTML=`全体 ${fmt(T)} ／ ${P.pages.length} ページ<br>`
    +(all?`録音ずみ ${got} / ${need} ページ。録音した声で作ります。`
         :`自動音声で作ります。（録音ずみ ${got} / ${need} ページ）`);
  $("#run-k").hidden=false; $("#run-io").hidden=false; $("#run-x").hidden=false;
  $("#run-v").hidden=true; $("#run-a").hidden=true;
  $("#run-c").hidden=true; $("#run-r").hidden=true; $("#run-b").hidden=true;
  $("#a-rec").onclick=()=>{ $("#run").hidden=true; openRec(); };
  $("#a-make").onclick=()=>runExport(all);
  $("#a-exp").onclick=exportP;
  $("#a-imp").onclick=()=>$("#pp").click();
  $("#a-back").onclick=backToPages;
}
function hideRun(){
  const v=$("#res"); try{ v.pause(); }catch{}
  $("#run").hidden=true;
  $("#run-k").hidden=true; $("#run-io").hidden=true; $("#run-x").hidden=true;
  $("#run-v").hidden=true;
}
/* 動画作成の画面 ⇄ 各ページ。iPhoneは横スワイプ、パソコンはボタンと←→キー */
function backToPages(){
  if(running) return;
  hideRun(); mk=false; cur=P.pages.length-1; paint();
}
function paintMake(){
  drawPager(); drawGauge();
  const tl=timeline(), T=tl.reduce((a,c)=>a+c.dur,0);
  const need=P.pages.filter(x=>speechOf(x)).length;
  const got =P.pages.filter(x=>speechOf(x)&&rec.has(x.id)).length;
  $("#stage").innerHTML=`<div class="mkbox">
    <div class="ttl">動画作成</div>
    <div class="sub">${P.pages.length}ページ・約 ${fmt(T)}</div>
    <div class="sub2">下の「動画を作る」で書き出します。<br>自分の声で読むときは「録音する」へ。</div>
  </div>`;
  $("#slide").innerHTML=`
    <div class="card"><h3>録音</h3>
      <p class="hint">録音できたページ ${got} / ${need}。全部そろっていれば、録音した声で動画を作ります。
      そろっていないときは自動音声で作ります。</p></div>
    <div class="card"><h3>内容の受け渡し</h3>
      <p class="hint">入力した文章だけをファイルに保存します（写真・動画・録音は入りません）。
      メールで送れば、ほかの人のアプリで読み込んで続きを編集できます。</p>
      <div class="rowbtns">
        <button class="sm" id="mk-exp">内容をファイルに保存</button>
        <button class="sm" id="mk-imp">ファイルから読み込む</button>
      </div></div>
    <div class="rowbtns rstrow"><button class="sm warn" id="rstall">全部消して最初からやり直す</button></div>`;
  $("#mk-exp").onclick=exportP;
  $("#mk-imp").onclick=()=>$("#pp").click();
  $("#rstall").onclick=resetAll;
  swipe($("#stage").querySelector(".mkbox"));
  $("#b-prev").disabled=false;
  $("#b-del").hidden=true;
  const allRec=need>0&&got>=need;          // 全ページ録音できていれば自分の声で作る
  const nb=$("#b-next"); nb.textContent="動画を作る"; nb.onclick=()=>runExport(allRec);
  const rb=$("#b-rec"); rb.hidden=false; rb.onclick=openRec;
  $("#b-cost").hidden=true;
}
/* ページ送り。最後のページの次は動画作成ページ */
function stepBy(d){
  if(mk){ if(d<0) closeMake(); return; }
  if(d>0&&cur===P.pages.length-1){ openMake(); return; }
  go(cur+d);
}
function go(i){
  mk=false;
  const n=Math.max(0,Math.min(P.pages.length-1,i));
  if(n===cur){paint();return;}
  const dir=n>cur?1:-1, sl=$("#slide"), st=$("#stage"), k=dir>0?"out":"outR";
  sl.classList.add(k); st.classList.add(k);
  setTimeout(()=>{cur=n;sl.classList.remove("out","outR");st.classList.remove("out","outR");
    paint();$(".body").scrollTop=0;},200);
}

/* ══════════ 7. 画面 ══════════ */
function paint(){
  if(mk){ paintMake(); return; }          // 動画作成ページ（v24）
  syncTitle();
  drawPager(); drawGauge();
  const p=page();
  // 見出し行（「1 改善前 3/7」）は資料の上から外し、その分だけ画面を上に詰めた
  $("#stage").innerHTML=
    p.kind==="content"&&hasPhoto(p)
      ?zoneHTML(p)
      :`<canvas class="paper" id="pv" width="1280" height="720"></canvas>`;
  $("#slide").innerHTML=`
    ${bodyHTML(p)}
    <div class="rowbtns rstrow"><button class="sm warn" id="rstall">全部消して最初からやり直す</button></div>`;
  bind(p);
  const c=$("#pv"); if(c) renderTo(c,p,0);
  $("#b-prev").disabled=cur===0;
  // 赤い「削除」は、写真や文章を入れる内容ページだけに出す
  const db=$("#b-del"); db.hidden=(p.kind!=="content"); db.onclick=()=>delPage(page());
  /* 下のボタン
     ・内容ページ … 「次へ」を押すとページが1枚増える（今のページの直後に挿入）
     ・効果ページ … 「次へ」を押すと効果の直後に「まとめ」が1枚増える
     ・そのほか   … これまでどおり次のページへ進む／最後は書き出し
     ・右のボタン … 本編なら「効果へ」、効果・まとめなら「結びへ」（結びでは出さない） */
  const lastPage=cur===P.pages.length-1;
  const addHere=p.kind==="content"||p.kind==="cost"||p.kind==="toc";
  $("#b-next").textContent=lastPage?"動画作成へ":(addHere?"次へ　＋":"次へ");
  $("#b-next").onclick=lastPage?openMake:(addHere?addPage:()=>go(cur+1));
  // 書き出しと録音は最後の「動画作成」ページに移した（v24）
  const rb=$("#b-rec"); rb.hidden=true;
  const jb=$("#b-cost");
  const toEnd=(p.kind==="cost"||isSum(p));
  jb.hidden=(p.kind==="closing");
  jb.textContent=toEnd?"結びへ":"効果へ";
  jb.onclick=()=>{const i=firstFixed(toEnd?"closing":"cost"); if(i>=0) go(i);};
}

// 金額が出ないときの理由。入力そのものではなく「足りないもの」を並べる
function costWarn(){
  const c=P.cost, w=[];
  const useM=c.target!=="man", useH=c.target!=="machine";
  const rateM=Number(S.chargeMachine)||0, rateH=Number(S.chargeMan)||0;
  const filled=x=>x!==""&&x!=null;
  if(!num(c.qty))  w.push("「数量（個）」が空欄です。");
  if(!num(c.base)) w.push("「下の時間は何個あたりか」が空欄です。1個あたりとして計算しています。");
  if(useM&&!(num(c.mBefore)-num(c.mAfter)>0))
    w.push(filled(c.mBefore)||filled(c.mAfter)
      ? "機械の時間が「改善前 ≦ 改善後」です。短縮になっていません。"
      : "機械の時間が空欄です。");
  if(useH&&!(num(c.hBefore)-num(c.hAfter)>0))
    w.push(filled(c.hBefore)||filled(c.hAfter)
      ? "人の時間が「改善前 ≦ 改善後」です。短縮になっていません。"
      : "人の時間が空欄です。");
  if(useM&&!rateM) w.push("設定ページの「機械チャージ（円／時）」が空欄です。");
  if(useH&&!rateH) w.push("設定ページの「マンチャージ（円／時）」が空欄です。");
  return w;
}
const fxHTML=()=>{
  const k=calc(), w=costWarn();
  return costLines().map(l=>`<div class="ln">${esc(l)}</div>`).join("")
    +`<div class="amt"><b>${yen(k.amount)}</b><span>／ ${k.period.name}</span></div>`
    +(w.length?`<div class="why"><b>金額が出ない理由</b>${
        w.map(t=>`<div>・${esc(t)}</div>`).join("")}${
        /設定ページ/.test(w.join(""))?`<button id="fx-set">設定を開く</button>`:""}</div>`:"");
};

function bind(p){
  const R=$("#slide");
  R.querySelectorAll("[data-m]").forEach(e=>e.oninput=()=>{
    const k=e.dataset.m;
    P.meta[k]=e.value;
    // タイトル画面で直接書いたら設定からの自動反映を止める（空に戻せばまた自動）
    if(k==="dept")      P.meta.deptLocked      = e.value.trim()!=="";
    if(k==="presenter") P.meta.presenterLocked = e.value.trim()!=="";
    if(k==="dept"||k==="presenter"||k==="members"||k==="speaker"){
      syncTitle();
      const sa=R.querySelector('[data-f="say"]');
      if(sa&&!p.sayLocked) sa.value=p.say||"";
      drawGauge();
    }
    save();live();});
  R.querySelectorAll("[data-f]").forEach(e=>e.oninput=()=>{
    const k=e.dataset.f;
    const old=keyOf(p);
    /* 見出し欄に手で書き込んだ時点で「自由記載」に切り替える。
       ここで先に切り替えておかないと、下の見出し表示の差し替えが効かない。 */
    if(k==="labelText"&&p.label!==FREE){
      p.label=FREE;
      const ls=R.querySelector("[data-lab]"); if(ls) ls.value=FREE;
    }
    p[k]=(k==="trimStart"||k==="trimEnd"||k==="pause")
      ?(e.value===""?null:Number(e.value)):e.value;
    if(k==="say"&&p.kind==="title") p.sayLocked=true;   // 手で直した文はそのまま残す
    audio.delete(old);audio.delete(keyOf(p));save();
    if(k==="labelText"){
      // 入力欄を作り直すとキーボードが閉じるので、表示だけを差し替える
      const h=$("#stage").querySelector(".head h1");
      if(h) h.textContent=(headText(p)&&dispLabel(p)!=="（見出しなし）")?headText(p):`ページ ${contentNo(p)}`;
      const pl=$("#pager").querySelector(`[data-i="${cur}"] .l`);
      if(pl) pl.textContent=dispLabel(p)||"ページ";
      live();drawGauge();return;
    }
    live();drawGauge();});
  const sa=R.querySelector("#sayauto");
  if(sa) sa.onclick=()=>{p.sayLocked=false;audio.delete(keyOf(p));save();paint();};
  R.querySelectorAll("[data-lay]").forEach(b=>b.onclick=()=>{
    p.layout=b.dataset.lay;audio.delete(keyOf(p));save();paint();});
  R.querySelectorAll("[data-ct]").forEach(e=>e.oninput=()=>{S.closingText=e.value;save();live();});
  const lab=R.querySelector("[data-lab]");
  const labin=R.querySelector("#labin");
  /* 見出し欄はふつうの入力欄。タップすればそのままキーボードが開く。
     （readonly のままだと iOS は「ペースト／選択」の吹き出しを出すだけでキーボードを開かない）
     入力中に paint() を呼ぶと iOS でキーボードが閉じるので、ここでは作り直さない。 */
  function seedLab(){
    if(p.label!==FREE&&!(p.labelText||"").trim()&&p.label!=="（見出しなし）") p.labelText=p.label;
  }
  function freeEdit(){
    seedLab();
    p.label=FREE;
    if(lab) lab.value=FREE;
    labin.value=p.labelText||"";
    labin.focus();                       // ← 操作と同じ流れの中で呼ぶ。あとから呼ぶと iOS はキーボードを出さない
    try{ labin.setSelectionRange(labin.value.length,labin.value.length); }catch{}
    save();
  }
  if(labin){
    /* タップした瞬間に、いま選ばれている見出しの文字を入れておく。
       ここではまだ「自由記載」にはしない（実際に書き換えたときだけ切り替わる）。 */
    labin.addEventListener("focus",()=>{
      seedLab();
      if(p.label!==FREE) labin.value=p.labelText||"";
    });
    labin.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); labin.blur(); } });
    labin.onblur=()=>{ save(); drawPager(); drawGauge(); };
  }
  if(lab){
    // ▼は「選ぶ」だけ。開く前にキーボードを閉じて、入力欄のタップと役割を分ける
    lab.addEventListener("mousedown",()=>{ if(labin) labin.blur(); });
    lab.addEventListener("touchstart",()=>{ if(labin) labin.blur(); },{passive:true});
    lab.onchange=()=>{
      if(lab.value===FREE){ freeEdit(); return; }     // 自由記載を選んだときだけ入力欄を開く
      p.label=lab.value; save(); paint();
    };
  }
  R.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    p.mode=b.dataset.mode;audio.delete(keyOf(p));save();paint();});
  R.querySelectorAll("[data-c]").forEach(e=>e.oninput=()=>{
    const k=e.dataset.c;
    const old=keyOf(p);
    P.cost[k]=["qtyUnit","target"].includes(k)?e.value
             :(e.value===""?"":Number(e.value));      // 空欄は空欄のまま保つ
    audio.delete(old);audio.delete(keyOf(p));save();
    const fx=R.querySelector("#fx"); if(fx) fx.innerHTML=fxHTML();
    live();drawGauge();});
  // 「設定を開く」は中身を作り直しても効くように、枠側で受ける
  const fxBox=R.querySelector("#fx");
  if(fxBox) fxBox.onclick=ev=>{ if(ev.target.id==="fx-set") openSettings(); };

  const ST=$("#stage");                     // 資料の欄はスクロールの外（固定）に出した
  const chg=ST.querySelector("#chg");       // 枠外（右上）に移動したので個別に受ける
  if(chg) chg.onclick=ev=>{ ev.stopPropagation(); pick(p,false); };
  const zone=ST.querySelector(".tapzone");
  if(zone){
    zone.onclick=ev=>{ if(swiped) return;
      if(!p.mediaId||isLost(p)) pick(p,false); else zoom(); };
  }else{
    const c=ST.querySelector("#pv"); if(c) c.onclick=()=>{ if(!swiped) zoom(); };
  }
  swipe(ST.querySelector("#pv"));
  const dup=R.querySelector("#dup");
  if(dup) dup.onclick=()=>{
    const np={...p,id:uid()};
    P.pages.splice(cur+1,0,np); cur++; save(); paint();};
  const am=R.querySelector("#addmulti");
  if(am) am.onclick=()=>pick(p,true);
  const ra=R.querySelector("#rstall");
  if(ra) ra.onclick=resetAll;
}

/* ページを1枚消す。下のバーの赤い「削除」から呼ぶ（v43） */
async function delPage(p){
  if(!p||p.kind!=="content") return;
  if(!await ask("このページを削除",
    "このページの写真・文章をまとめて消します。元には戻せません。","削除する")) return;
  if(p.mediaId){dropMedia(p.mediaId);delB(p.mediaId);}
  audio.delete(keyOf(p));
  // 最後の1枚でもそのまま消す。内容ページが0枚でも
  // タイトル・目次・効果・結びは残るので困らない（v44）
  const i=P.pages.indexOf(p);
  P.pages.splice(i,1);
  cur=Math.min(P.pages.length-1,Math.max(0,i-1));
  save(); paint();
}

/* 全リセット。作ったものだけを消して、設定（APIキー・部署・代表者・単価・声など）は残す。 */
async function resetAll(){
  if(!await ask("全部消して最初から",
    "今つくった資料をすべて消して、まっさらな状態に戻します。\n"+
    "写真・動画・入力した文章はすべて消えます。元には戻せません。\n\n"+
    "設定（APIキー・部署・代表者・チャージ単価・声など）はそのまま残ります。",
    "全部消す")) return;
  for(const id of [...media.keys()]) dropMedia(id);
  media.clear(); audio.clear(); rec.clear();
  try{ await idb("readwrite",s=>s.clear()); }catch{}   // 保存してある写真・動画も消す
  P=blank(); migrate();
  P.meta.deptLocked=false; P.meta.presenterLocked=false;   // 設定からまた自動で入るように
  cur=0; mk=false; outFile=null; forceRec=false;
  try{ localStorage.setItem("ti.p",JSON.stringify(P)); }catch{}
  save();
  hideRun(); $("#zoom").hidden=true;
  $("#run-a").hidden=true; $("#run-b").hidden=true;
  $("#run-c").hidden=true; $("#run-r").hidden=true;
  paint();
}
let swiped=false;
function swipe(el){
  if(!el) return;
  let x0=0,y0=0,t0=0;
  el.addEventListener("touchstart",e=>{
    const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); swiped=false;},{passive:true});
  el.addEventListener("touchend",e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.6 && dt<700){
      swiped=true;
      if(el===$("#run")){ if(dx>0) backToPages(); }
      else stepBy(dx<0?1:-1);
      setTimeout(()=>swiped=false,400);
    }},{passive:true});
}
swipe($("#run"));            // 動画作成の画面を右へスワイプすると各ページへ戻る

function renderTo(cv,p,t){
  const g=cv.getContext("2d",{alpha:false});
  draw(g,cv.width,cv.height,cv.width/1280,p,t);
}
const CIRC=i=>"①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳"[i]||(i+1)+".";
function wrap(g,t,mx){const o=[];let l="";
  for(const ch of t){if(ch==="\n"){o.push(l);l="";continue;}
    if(g.measureText(l+ch).width>mx&&l){o.push(l);l=ch;}else l+=ch;}
  if(l)o.push(l);return o;}
function subtitle(g,text,W,H,s){
  if(!text) return;
  let size=S.subSize*s,lines;const mx=W*0.88;
  for(;;){g.font=`700 ${size}px "Hiragino Sans","BIZ UDPGothic",sans-serif`;
    lines=wrap(g,text,mx);
    if(lines.length<=S.subMaxLines||size<14*s)break;size*=0.92;}
  if(lines.length>S.subMaxLines)lines=lines.slice(0,S.subMaxLines);
  const lh=size*1.4,bot=H-H*(S.subBottom/100),top=bot-lh*lines.length;
  if(S.subStyle==="band"){g.fillStyle="rgba(0,0,0,.6)";g.fillRect(0,top-lh*.3,W,lh*lines.length+lh*.5);}
  // 折り返した行は左端をそろえる（かたまりごと中央に置く）
  const lw=Math.max(...lines.map(l=>g.measureText(l).width));
  const lx=(W-lw)/2;
  g.textAlign="left";g.textBaseline="alphabetic";
  lines.forEach((l,i)=>{const y=top+lh*(i+1)-lh*.26;
    if(S.subStyle==="outline"){g.lineJoin="round";g.miterLimit=2;
      g.lineWidth=Math.max(3,size*.14);g.strokeStyle="rgba(0,0,0,.9)";g.strokeText(l,lx,y);}
    g.fillStyle=S.subColor;g.fillText(l,lx,y);});
}
// 効果ページの計算式は、入る限りいちばん大きい文字で出す。
// そのままでは横幅で頭打ちになるので、「→」で折り返した形も試して大きいほうを採る。
const arrowSplit=l=>{const i=l.indexOf("→");
  return i>0?[l.slice(0,i).trim(),"　"+l.slice(i).trim()]:[l];};
function fitCost(g,ln,maxW,maxH,s){
  let best={fz:0,rows:ln};
  for(const rows of [ln,ln.flatMap(arrowSplit)]){
    let fz=52;
    while(fz>18){
      g.font=`400 ${fz*s}px "Hiragino Sans",sans-serif`;
      const wide=Math.max(...rows.map(l=>g.measureText(l).width));
      if(wide<=maxW && rows.length*fz*1.45*s<=maxH) break;
      fz--;
    }
    if(fz>best.fz) best={fz,rows};
  }
  return best;
}
/* 写真・動画から「いま描ける絵」を取り出す。書き出し中は動画本体、
   画面のプレビューでは焼いておいた静止画（poster）を使う */
function pickMedia(m){
  if(!m) return null;
  const isV=m.kind==="video";
  const noFrame=isV&&(!m.el||m.el.readyState<2);
  const useP=isV&&(!exporting||noFrame);
  const el=useP?(m.poster||(exporting?m.el:null)):m.el;
  if(!el) return null;
  const iw=el.videoWidth||el.naturalWidth||el.width||0;
  const ih=el.videoHeight||el.naturalHeight||el.height||0;
  return (iw&&ih)?{el,iw,ih}:null;
}
function draw(g,W,H,s,p,t){
  const T=theme();
  g.fillStyle=T.bg;g.fillRect(0,0,W,H);
  g.fillStyle=T.ac;g.fillRect(0,0,W,5*s);

  if(p.kind==="title"){
    g.textAlign="center";
    g.fillStyle=T.sub;g.font=`600 ${38*s}px "Hiragino Sans",sans-serif`;
    g.fillText("業務改善提案",W/2,H*0.215);
    g.fillStyle=T.fg;g.font=`700 ${86*s}px "Hiragino Sans",sans-serif`;
    const tl=wrap(g,P.meta.title||"（提案タイトル）",W*0.86).slice(0,2);
    let tw=0; tl.forEach(l=>tw=Math.max(tw,g.measureText(l).width));
    tl.forEach((l,i)=>g.fillText(l,W/2,H*0.42+i*100*s));
    const ty=H*0.42+(tl.length-1)*100*s;
    g.strokeStyle=T.ac;g.lineWidth=5*s;                 // 下線はタイトルの幅に合わせる
    g.beginPath();g.moveTo(W/2-tw/2,ty+58*s);g.lineTo(W/2+tw/2,ty+58*s);g.stroke();
    g.fillStyle=T.sub;g.font=`400 ${34*s}px "Hiragino Sans",sans-serif`;
    const who=[S.orgName,P.meta.dept].filter(Boolean).join("　");
    if(who)g.fillText(who,W/2,H*0.735);
    g.fillStyle=T.fg;g.font=`700 ${52*s}px "Hiragino Sans",sans-serif`;
    if(P.meta.presenter)g.fillText(P.meta.presenter,W/2,H*0.825);
    g.fillStyle=T.sub;g.font=`400 ${32*s}px "Hiragino Sans",sans-serif`;
    if(P.meta.members)g.fillText("メンバー："+P.meta.members,W/2,H*0.905);
    return;

  if(p.kind==="toc"){
    /* 「目次」の見出しは左上に置き、下線は文字の幅だけ（全幅の薄墨線は引かない）。
       画面を上下に区切る線がなくなるので、項目は画面全体の上下中央に並べる。 */
    head(g,T,"目次",W,s,true);
    const ls=tocItems();
    const n=Math.max(1,ls.length);
    const hl=92*s;                               // 見出し「目次」の下線の位置
    const avail=(H-16*s)-(hl+16*s);              // 項目を置ける高さ
    const rowH=Math.min(avail/n, 112*s);         // 項目が少ないときに間延びしすぎないよう上限
    /* 横は「いちばん長い項目」を基準にひとかたまりとして中央へ。
       そのうえで①②…の左端は全部そろえる（各行を個別に中央寄せしない）。 */
    const maxW=W*0.84;
    let fs=Math.max(24,Math.min(56,(rowH/s)*0.46)), wide=0, numW=0;
    for(;;){
      g.font=`700 ${(fs-6)*s}px "Hiragino Sans",sans-serif`;
      numW=g.measureText("①").width+18*s;        // 丸数字の幅＋アキ
      g.font=`600 ${fs*s}px "Hiragino Sans",sans-serif`;
      wide=Math.max(...ls.map(l=>g.measureText(l).width));
      if(numW+wide<=maxW || fs<=20) break;
      fs--;
    }
    /* 上下の振り分け。項目の下線は細い薄墨で目に留まらないので、そこは数えずに
       「1行目の文字の上端 〜 最後の項目の文字の下端」を1つのかたまりとみなし、
       画面全体（上端〜下端）の中で上下中央に置く。見出しに重なるときだけ下へ逃がす。 */
    g.textBaseline="middle";
    const upDn=(txt,size)=>{                      // その文字が中心から上下どれだけ出るか
      g.font=`600 ${size}px "Hiragino Sans",sans-serif`;
      const m=g.measureText(txt||"あ");
      return [m.actualBoundingBoxAscent||size*0.52, m.actualBoundingBoxDescent||size*0.12];
    };
    const capT=Math.max(upDn(ls[0],fs*s)[0], upDn(CIRC(0),(fs-6)*s)[0]);
    const capB=Math.max(upDn(ls[n-1],fs*s)[1], upDn(CIRC(n-1),(fs-6)*s)[1]);
    const inkH=(n-1)*rowH+capT+capB;              // 文字だけで見たときの高さ
    let cy0=(H-inkH)/2+capT;                      // 1行目の中心（画面全体の中央）
    const edge=8*s;                               // はみ出しだけ抑える
    const lastRule=cy0+(n-1)*rowH+rowH*0.40;
    if(lastRule>H-edge) cy0-=lastRule-(H-edge);
    if(cy0-capT<hl+edge) cy0=hl+edge+capT;
    const blockW=Math.max(numW+wide, W*0.34);     // 短い項目でも線が短くなりすぎないように
    const x=(W-blockW)/2, xr=x+blockW;            // ← ここが全行そろった左端
    ls.forEach((l,i)=>{
      const cy=cy0+rowH*i;
      g.textAlign="left";
      g.fillStyle=T.ac;g.font=`700 ${(fs-6)*s}px "Hiragino Sans",sans-serif`;
      g.fillText(CIRC(i),x,cy);
      g.fillStyle=T.fg;g.font=`600 ${fs*s}px "Hiragino Sans",sans-serif`;
      g.fillText(l,x+numW,cy);
      g.strokeStyle=T.line;g.lineWidth=1.5*s;
      g.beginPath();g.moveTo(x,cy+rowH*0.40);g.lineTo(xr,cy+rowH*0.40);g.stroke();});
    g.textBaseline="alphabetic";
    return;
  }
  if(p.kind==="cost"){
    head(g,T,"効果（原価低減）",W,s);
    g.textAlign="left";
    const mx=80*s;                                   // 左右の余白（広げたぶん文字を大きくできる）
    const maxW=W-mx*2, topY=H*0.245, botY=H*0.605;
    const {fz,rows}=fitCost(g,costLines(),maxW,botY-topY,s);
    const lh=fz*1.45*s;
    rows.forEach((l,i)=>{g.fillStyle=T.sub;
      g.font=`400 ${fz*s}px "Hiragino Sans",sans-serif`;
      g.fillText(l,mx,topY+lh*(i+1)-lh*0.30);});
    g.strokeStyle=T.ac;g.lineWidth=3*s;
    g.beginPath();g.moveTo(mx,H*0.64);g.lineTo(W-mx,H*0.64);g.stroke();
    const k=calc(), a=yen(k.amount);
    g.fillStyle=T.ac;g.font=`700 ${96*s}px "Hiragino Sans",sans-serif`;
    g.fillText(a,mx,H*0.82);
    const aw=g.measureText(a).width;
    g.fillStyle=T.sub;g.font=`400 ${34*s}px "Hiragino Sans",sans-serif`;
    g.fillText("／ "+k.period.name,mx+aw+20*s,H*0.82);

  }
  if(p.kind==="closing"){
    g.textAlign="center";g.fillStyle=T.fg;
    g.font=`700 ${58*s}px "Hiragino Sans",sans-serif`;
    g.fillText(S.closingText,W/2,H*0.5);
    const cw=g.measureText(S.closingText).width;        // 下線は文の幅に合わせる
    g.strokeStyle=T.ac;g.lineWidth=4*s;
    g.beginPath();g.moveTo(W/2-cw/2,H*0.57);g.lineTo(W/2+cw/2,H*0.57);g.stroke();
    return;
  }
  /* content */
  const lay=layoutOf(p);
  const hasHead=!!dispLabel(p)&&dispLabel(p)!=="（見出しなし）";
  if(hasHead) head(g,T,headText(p),W,s);
  const m=p.mediaId?media.get(p.mediaId):null;
  const sub=subOf(p);

  if(lay==="text"){                       // ① テキストのみ：中央にバランスよく改行
    const txt=(p.show||"").trim();
    if(!txt){
      g.textAlign="center";g.fillStyle=T.sub;
      g.font=`400 ${26*s}px "Hiragino Sans",sans-serif`;
      g.fillText("画面に出す文字を入力してください",W/2,H*0.55);
      return;
    }
    const topY=hasHead?130*s:60*s, boxH=H-topY-60*s, mx=W*0.80;
    let size=64, lines;
    for(;;){
      g.font=`700 ${size*s}px "Hiragino Sans","BIZ UDPGothic",sans-serif`;
      lines=wrap(g,txt,mx);
      if(lines.length*size*1.5<=boxH/s||size<=22) break;
      size*=0.94;
    }
    /* 折り返した行は一行ずつ中央寄せにせず、いちばん長い行を基準に

    const lh=size*1.5*s, top=topY+(boxH-lh*lines.length)/2;
    const lw=Math.max(...lines.map(l=>g.measureText(l).width));
    const lx=(W-lw)/2;
    g.textAlign="left";g.textBaseline="alphabetic";g.fillStyle=T.fg;
    lines.forEach((l,i)=>g.fillText(l,lx,top+lh*(i+1)-lh*0.32));
    return;
  }

  if(lay==="side"){                      // ④ 写真を左・文字を右（v39）
    const topY=hasHead?112*s:44*s, botY=H-46*s;
    const mx=52*s, gap=34*s, bh=botY-topY;

      g.drawImage(mm.el,mx+(lw-w)/2,topY+(bh-h)/2,w,h);
    }else if(!exporting){
      g.textAlign="center";g.textBaseline="alphabetic";g.fillStyle=T.sub;
      g.font=`400 ${24*s}px "Hiragino Sans",sans-serif`;
      g.fillText(m?"▶ 動画 挿入済":"写真・動画を選んでください",mx+lw/2,topY+bh/2);
    }
    const txt=(p.show||"").trim();
    if(txt){
      let size=46,lines;
      for(;;){
        g.font=`600 ${size*s}px "Hiragino Sans","BIZ UDPGothic",sans-serif`;
        lines=wrap(g,txt,rw);
        if(lines.length*size*1.6<=bh/s||size<=18) break;
        size*=0.94;
      }
      const lh=size*1.6*s, top=topY+(bh-lh*lines.length)/2;
      g.textAlign="left";g.textBaseline="alphabetic";g.fillStyle=T.fg;
      const rx=mx+lw+gap;
      lines.forEach((l,i)=>g.fillText(l,rx,top+lh*(i+1)-lh*0.34));
    }else if(!exporting){
      g.textAlign="left";g.fillStyle=T.sub;
      g.font=`400 ${24*s}px "Hiragino Sans",sans-serif`;
      g.fillText("右に出す文字を入力してください",mx+lw+gap,topY+bh/2);
    }

  }

  if(m){
    // 画面プレビューでは動画の代わりに焼いておいた静止画（poster）を描く。
    //   poster が取れなかったときは何も描かず、下の「▶ 動画 挿入済」の案内を出す。
    // 書き出し中（exporting）は動画本体を使う。まだ1コマも用意できていないときだけ
    //   poster で埋める（案内の文字は完成動画に出さない）。
    const isV = m.kind==="video";
    const noFrame = isV && (!m.el || m.el.readyState<2);
    const useP = isV && (!exporting || noFrame);
    const el = useP ? (m.poster || (exporting ? m.el : null)) : m.el;
    const iw = el?(el.videoWidth||el.naturalWidth||el.width||0):0;
    const ih = el?(el.videoHeight||el.naturalHeight||el.height||0):0;
    const topY=hasHead?110*s:40*s;
    const rsv=sub?H*(S.subBottom/100)+S.subSize*s*(S.subMaxLines+0.7):40*s;
    const bw=W-80*s, bh=Math.max(100*s,H-topY-rsv);

      g.textAlign="center";g.textBaseline="alphabetic";g.fillStyle=T.sub;
      g.font=`400 ${40*s}px "Hiragino Sans",sans-serif`;
      g.fillText("▶ 動画 挿入済",W/2,topY+bh/2+14*s);
    }
  }else{
    g.textAlign="center";g.fillStyle=T.sub;
    g.font=`400 ${26*s}px "Hiragino Sans",sans-serif`;
    g.fillText("写真・動画を選んでください",W/2,H*0.55);
  }
  if(lay!=="photoonly"&&!sub&&(p.show||"").trim()&&p.mode!=="both"){
    g.textAlign="right";g.fillStyle=T.sub;g.font=`400 ${20*s}px "Hiragino Sans",sans-serif`;
    g.fillText(p.mode==="mute"?"（無音）":"♪ 読み上げのみ",W-40*s,H-24*s);
  }
  subtitle(g,sub,W,H,s);
}
function head(g,T,lb,W,s,short){

  g.textAlign="left";g.textBaseline="alphabetic";
  g.fillStyle=T.fg;g.font=`700 ${40*s}px "Hiragino Sans",sans-serif`;g.fillText(lb,64*s,74*s);
  g.strokeStyle=T.ac;g.lineWidth=4*s;

  if(short) return;

function kanNum(digits){                // 整数（文字列）を漢数字に

  while(n.length){
    const g=n.slice(-4); n=n.slice(0,-4);
    if(+g) out.unshift(kan4(+g)+unit[i]);
    i++;
    if(i>=unit.length) break;
  }
  return out.join("")||"〇";
}
function numToKana(t){
  // ¥1,000 のような通貨記号は「〜円」に直してから数字を変換する
  return (t||"").replace(/[¥￥]\s*(\d[\d,]*(?:\.\d+)?)\s*円?/g,"$1円")
    .replace(/\d[\d,]*(?:\.\d+)?/g,m=>{
    const hasComma=m.includes(",");
    const plain=m.replace(/,/g,"");
    const [ip,fp]=plain.split(".");
    // カンマ付き、または5桁以上のときだけ漢数字にする（15分などはそのまま）
    if(!hasComma&&ip.length<5) return plain;
    let s=kanNum(ip);
    if(fp) s+="点"+fp.split("").map(c=>KANSU[+c]).join("");
    return s;
  });
}
/* ① 読み間違いの補正。字幕はそのまま、TTSへ送る文だけを置き換える */
function readFix(t){
  let s=t||"";
  for(const r of (S.readFixes||[])){
    if(!r||!r.on||!r.f) continue;
    s=s.split(r.f).join(r.t??"");
  }
  return numToKana(s);
}
async function ttsBytes(text){
  if(!S.ttsKey) throw new Error("APIキーが未入力です");
  if(!text||!text.trim()) throw new Error("読み上げる文がありません");
  text=readFix(text);
  const url="https://texttospeech.googleapis.com/v1/text:synthesize?key="+encodeURIComponent(S.ttsKey.trim());
  const call=cfg=>fetch(url,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({input:{text},voice:{languageCode:"ja-JP",name:S.ttsVoice},audioConfig:cfg})});
  const base={audioEncoding:"LINEAR16",sampleRateHertz:24000};
  const full={...base,speakingRate:Number(S.ttsRate)};
  if(!isChirp(S.ttsVoice)) full.pitch=Number(S.ttsPitch);
  let r;
  try{ r=await call(full); }
  catch(e){ throw new Error("通信できません（ネットワークかCORS）："+e.message); }
  if(r.status===400){
    const first=await r.text();
    try{ r=await call(base); }catch(e){ throw new Error("通信できません："+e.message); }
    if(r.ok) log("この声は速度指定に非対応のため、標準速度で作りました。","w");
    else r._first=first;
  }
  if(!r.ok){
    const t=await r.text();
    let msg=t;
    try{ msg=JSON.parse(t).error?.message||t; }catch{}
    throw new Error(`${r.status}：${String(msg).slice(0,160)}`);
  }
  const j=await r.json();
  if(!j.audioContent) throw new Error("音声データが空で返ってきました");
  const bin=atob(j.audioContent);
  const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return u8;
}
async function tts(text){
  const u8=await ttsBytes(text);
  try{ return await AC().decodeAudioData(u8.buffer.slice(0)); }
  catch(e){ throw new Error("音声の読み込みに失敗しました："+(e.message||e)); }
}
/* 音声の取り出し口。録音モードなら自分の声、ふだんは自動音声（TTS） */
function voiceOf(p){
  if(useRec){ const r=rec.get(p.id); return r?{buf:r.buf,dur:r.dur}:null; }
  return audio.get(keyOf(p));
}
async function ensureBuf(r){
  if(r.buf) return r;
  r.buf=await AC().decodeAudioData(await r.blob.arrayBuffer());
  r.dur=r.buf.duration;
  return r;
}
// マイクの録りは小さめになりがちなので、大きさをそろえる
function normGain(buf){
  let peak=0; const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i+=53) peak=Math.max(peak,Math.abs(d[i]));
  if(peak<0.005) return 1;
  return Math.max(1,Math.min(6,0.86/peak));
}
async function makeVoices(prog){
  const need=P.pages.filter(p=>speechOf(p)&&!audio.has(keyOf(p)));
  if(!need.length) return true;
  let i=0, ok=true;
  for(const p of need){
    try{
      const b=await tts(speechOf(p));
      audio.set(keyOf(p),{buf:b,dur:b.duration});
      log(`音声 ${i+1}/${need.length}  ${b.duration.toFixed(1)}秒`);
    }catch(e){ ok=false; log("音声の失敗："+e.message,"e"); }
    prog&&prog(++i/need.length);
  }
  return ok;
}

/* Safari の AudioEncoder は description に esds 全体を返すことがあり、
   そのまま渡すと二重の入れ子になって音声が壊れる。素の AudioSpecificConfig を取り出す。 */
const ASR=48000;
const FREQ=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
function synthASC(sr,ch){
  const idx=Math.max(0,FREQ.indexOf(sr)<0?3:FREQ.indexOf(sr));
  return new Uint8Array([(2<<3)|(idx>>1), ((idx&1)<<7)|(ch<<3)]);
}
function findDSI(u8){
  let i=0;
  const rdLen=()=>{let n=0,b;do{b=u8[i++];n=(n<<7)|(b&0x7f);}while(b&0x80&&i<u8.length);return n;};
  const scan=end=>{
    while(i<end-1){
      const tag=u8[i++], len=rdLen(), st=i;
      if(len<=0||st+len>u8.length) return null;
      if(tag===0x05) return u8.subarray(st,st+len);
      if(tag===0x03){ i=st+3; const r=scan(st+len); if(r) return r; }
      else if(tag===0x04){ i=st+13; const r=scan(st+len); if(r) return r; }
      i=st+len;
    }
    return null;
  };
  return scan(u8.length);
}
function ascOf(desc,sr,ch){
  let u8=null;
  try{
    if(desc) u8=(desc instanceof Uint8Array)?desc
      :new Uint8Array(desc.buffer?desc.buffer:desc, desc.byteOffset||0, desc.byteLength||undefined);
  }catch{}
  if(u8&&u8.length){
    if(u8[0]===0x03||u8[0]===0x04){          // esds が丸ごと来た場合
      const d=findDSI(u8);
      if(d&&d.length>=2&&(d[0]>>3)>=1&&(d[0]>>3)<=5) return new Uint8Array(d);
    }else if((u8[0]>>3)>=1&&(u8[0]>>3)<=5){  // すでに素の形
      return new Uint8Array(u8);
    }
  }
  return synthASC(sr,ch);
}
